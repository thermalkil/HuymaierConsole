name: Materialize v0.26.4 Storefront UTF8 Encoding
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/storefront-encoding-request.json','.development/v0.26.4/apply_storefront_utf8_bom.py','.github/workflows/materialize-v0264-storefront-encoding.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-storefront-encoding, cancel-in-progress: false}
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Add UTF8 BOM to Unicode storefront keyboard source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .development\v0.26.4\apply_storefront_utf8_bom.py;if($LASTEXITCODE){throw 'Storefront encoding materializer failed'}
      - name: Validate Windows PowerShell 5.1 parse and glyph preservation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path '.\HuymaierStorefronts.ps1'))
          if($bytes.Length -lt 3 -or $bytes[0]-ne0xEF -or $bytes[1]-ne0xBB -or $bytes[2]-ne0xBF){throw 'Storefront module is not UTF-8 BOM encoded.'}
          $t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierStorefronts.ps1'),[ref]$t,[ref]$e)
          if($e.Count){$e|ForEach-Object{Write-Host $_.Message};throw 'Storefront module still fails Windows PowerShell 5.1 parsing.'}
          $text=Get-Content -Raw -Encoding UTF8 '.\HuymaierStorefronts.ps1'
          foreach($codepoint in @(0x20AC,0x00A3,0x00A5,0x20B9,0x2190,0x2713,0x2605,0x266A)){$glyph=[char]$codepoint;if(-not $text.Contains([string]$glyph)){throw ('Native keyboard glyph was lost: U+'+$codepoint.ToString('X4'))}}
      - name: Commit validated encoding
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierStorefronts.ps1;if(git diff --cached --quiet){exit 0};git commit -m 'Mark storefront module UTF-8 for Windows PowerShell 5.1';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Storefront encoding rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Storefront encoding push failed'}
