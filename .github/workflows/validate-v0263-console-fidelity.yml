name: Validate v0.26.3 Console Fidelity

on:
  push:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - 'Native/HuymaierConsole.ConsolePlatforms.cs'
      - '.development/v0.26.3/validation-request.json'
      - '.github/workflows/validate-v0263-console-fidelity.yml'

permissions:
  contents: write

concurrency:
  group: v0263-console-fidelity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify PlayStation interfaces are untouched
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main --depth=1
          $changed=@(git diff --name-only origin/main...HEAD)
          $forbidden=@($changed|Where-Object{
            $_ -match '(^|/)(PS1|PS2|PS3)(/|$)' -or
            $_ -match 'Ps1|Ps2|Ps3|PS1|PS2|PS3'
          })
          if($forbidden.Count){throw ('v0.26.3 changed frozen PlayStation files: '+($forbidden -join ', '))}
          Write-Host 'PS1, PS2, and PS3 production surfaces remain untouched.'

      - name: Parse production PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File | Where-Object {
            $_.Extension -in @('.ps1','.psm1','.psd1') -and
            $_.FullName -notmatch '[\\/](\.development|\.source|\.release|\.build|\.github)[\\/]'
          })
          $failures=New-Object Collections.Generic.List[string]
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            foreach($error in @($errors)){[void]$failures.Add("$($file.Name):$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber) $($error.Message)")}
          }
          if($failures.Count){throw ($failures -join "`r`n")}
          Write-Host "Parsed $($files.Count) production PowerShell files successfully."

      - name: Compile exact x64 managed host sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not(Test-Path -LiteralPath $csc)){throw 'Framework64 csc.exe was not found.'}
          $automation=[Management.Automation.PSObject].Assembly.Location
          $refs=@(
            [Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,
            [Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,
            [Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,
            [Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation
          )|Select-Object -Unique
          $sources=@(
            'Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs',
            'Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs',
            'HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs'
          )|ForEach-Object{Join-Path $env:GITHUB_WORKSPACE $_}
          foreach($source in $sources){if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw "Native source missing: $source"}}
          $out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0263-fidelity-validation.exe'
          $args=@('/noconfig','/nologo','/target:winexe','/platform:x64','/optimize+',('/out:'+$out))
          foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources
          & $csc @args
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $out -PathType Leaf)){throw 'v0.26.3 x64 managed host compile failed.'}

      - name: Validate console fidelity and navigation invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='Native\HuymaierConsole.ConsolePlatforms.cs'
          $source=Get-Content -Raw -LiteralPath $path -Encoding UTF8
          foreach($required in @(
            'RenderN64GamePakLauncher','RenderGameCubeHub','RenderGameCubeCalendar',
            'RenderWiiMenuAuthentic','RenderWiiChannelStart','RenderWiiUMenuAuthentic',
            'RenderSwitchHomeAuthentic','RenderSwitchAllSoftware','RenderXboxRoot',
            'ProcessMetroNavigationCommand','ProcessGameCubeHubCommand','ProcessSwitchHomeCommand',
            'using System.Windows.Controls.Primitives;'
          )){if($source -notmatch [regex]::Escape($required)){throw "Console fidelity invariant missing: $required"}}
          if($source -match [regex]::Escape('LB / RB')){throw 'A native console surface still advertises bumper-based selection/page navigation.'}
          if($source -match 'LeftShoulder[^\r\n]{0,120}SwitchPage' -or $source -match 'RightShoulder[^\r\n]{0,120}SwitchPage'){
            throw 'Shoulder buttons still change native console page/selection state.'
          }
          if($source -notmatch [regex]::Escape('if (command == XmbInputCommand.LeftShoulder || command == XmbInputCommand.RightShoulder) return;')){
            throw 'Shared native-console shoulder no-op gate is missing.'
          }
          Write-Host 'Console fidelity and no-bumper navigation invariants passed.'

      - name: Record validation status
        if: always()
        shell: powershell
        env:
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path '.development\v0.26.3'|Out-Null
          $state=[ordered]@{result=$env:VALIDATION_RESULT;commit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;recordedAtUtc=[DateTime]::UtcNow.ToString('o')}
          $state|ConvertTo-Json|Set-Content -LiteralPath '.development\v0.26.3\validation-status.json' -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.development/v0.26.3/validation-status.json'
          if(-not(git diff --cached --quiet)){git commit -m 'Record v0.26.3 console fidelity validation';git push origin HEAD:feature/v0.26.3-console-fidelity}
