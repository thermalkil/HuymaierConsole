name: Fix GPU cache compiler local shadowing

on:
  push:
    paths:
      - '.github/workflows/fix-gpu-cache-shadow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Rename shadowed matrix local and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('Native/HuymaierGpuShelfAssetCompiler.cs')
          text=p.read_text(encoding='utf-8-sig')
          old='''            if (matrix.Length == 16)\n            {\n                double[] m = new double[16];\n                for (int i = 0; i < 16; i++) m[i] = Convert.ToDouble(matrix[i], CultureInfo.InvariantCulture);\n                return m;\n            }'''
          new='''            if (matrix.Length == 16)\n            {\n                double[] matrixValues = new double[16];\n                for (int i = 0; i < 16; i++) matrixValues[i] = Convert.ToDouble(matrix[i], CultureInfo.InvariantCulture);\n                return matrixValues;\n            }'''
          if old not in text: raise SystemExit('Shadowed NodeMatrix local block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-gpu-cache-shadow.yml').unlink()
      - name: Commit compiler correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Framework compiler shadowing in GPU shelf cache builder'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
