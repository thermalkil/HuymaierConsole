name: Validate v0.26.5 Model Provider Fixes

on:
  push:
    branches:
      - agent/v0265-model-provider-fixes

permissions:
  contents: read

concurrency:
  group: huymaier-v0265-model-provider-fixes
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply model/provider fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Apply-v0265-NamingRecompsFixesV3.ps1'
          & '.\.development\v0.26.5\Apply-v0265-ModelRenderingFixesV2.ps1'
          & '.\.development\v0.26.5\Apply-v0265-ModelRenderingTestUpdates.ps1'

      - name: Diagnose transformed provider parse
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierGameProviders.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){
            foreach($e in @($errors)){Write-Host ("PROVIDER_PARSE line={0} col={1} text=[{2}] message={3}" -f $e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Extent.Text,$e.Message)}
            $lines=Get-Content '.\HuymaierGameProviders.ps1'
            $line=[int]$errors[0].Extent.StartLineNumber
            $start=[math]::Max(1,$line-18);$end=[math]::Min($lines.Count,$line+18)
            for($i=$start;$i-le$end;$i++){Write-Host (('{0,5}: ' -f $i)+$lines[$i-1])}
            throw 'Transformed HuymaierGameProviders.ps1 failed parse.'
          }

      - name: Parse and audit naming
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Test-v0265-PowerShellSafety.ps1'
          & '.\.development\v0.26.5\Test-v0265-PlatformNamingAudit.ps1'

      - name: Validate Recomps and GPU models
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Prepare-v0265-PlatformModelValidation.ps1'
          & '.\.development\v0.26.5\Test-v0265-PlatformModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-User3DModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-Live3DCardRender.ps1'
          & '.\.development\v0.26.5\Test-v0265-FullModelViewerUvBrightness.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11ShelfBackend.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuShelfAssetCompiler.ps1'
          & '.\.development\v0.26.5\Test-v0265-MirroredModelWinding.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11CachedModelRender.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11UvAddressing.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuPlatformShelvesV7.ps1'
          & '.\.development\v0.26.5\Test-v0265-CanonicalRecomps.ps1'
