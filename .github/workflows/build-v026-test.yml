name: Build Huymaier Console Windows Candidate

on:
  push:
    branches:
      - feature/v0.26.0-native-gamebar
      - hotfix/v0.26.1-installer
    paths:
      - '.development/v0.26.0/build-trigger.json'
      - '.development/v0.26.1/build-trigger.json'
      - '.build/Build-HuymaierReleaseCandidate.ps1'
      - '.build/Test-HuymaierCandidate.ps1'
      - '.github/workflows/build-v026-test.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-windows-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve candidate trigger
        id: trigger
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=if(Test-Path '.development\v0.26.1\build-trigger.json'){'.development\v0.26.1\build-trigger.json'}else{'.development\v0.26.0\build-trigger.json'}
          if(-not(Test-Path $path)){throw 'No candidate build trigger was found.'}
          $data=Get-Content -Raw $path -Encoding UTF8|ConvertFrom-Json
          "path=$path"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate=$([string]$data.candidate)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$([string]$data.asset_name)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_root=$([string]$data.package_root)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "status=$([IO.Path]::Combine([IO.Path]::GetDirectoryName($path),'build-status.json'))"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build exact x64 FSE Home host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not(Test-Path -LiteralPath $csc)){throw 'Framework64 csc.exe was not found.'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'HuymaierFSEHost.cs'
          $output=Join-Path $env:GITHUB_WORKSPACE 'FSEPackage\HuymaierFSEHost.exe'
          if(-not(Test-Path -LiteralPath $source)){throw 'HuymaierFSEHost.cs is missing.'}

          # /noconfig intentionally ignores csc.rsp, so every non-mscorlib
          # framework dependency is resolved explicitly. This avoids hidden
          # compiler-machine defaults while still supporting ProcessStartInfo.
          $systemAssembly=[System.Diagnostics.Process].Assembly.Location
          if([string]::IsNullOrWhiteSpace([string]$systemAssembly) -or -not(Test-Path -LiteralPath $systemAssembly -PathType Leaf)){
            throw 'System.dll could not be resolved for the deterministic FSE host compile.'
          }
          & $csc /noconfig /nologo /target:winexe /platform:x64 /optimize+ ('/reference:'+$systemAssembly) ('/out:'+$output) $source
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $output)){throw 'x64 FSE Home host compilation failed.'}
          # Intent-to-add makes the generated path visible to git ls-files during
          # staging without placing the generated binary in the commit index.
          git add -N -f FSEPackage/HuymaierFSEHost.exe

      - name: Build and integrity-test release-shaped candidate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & .\.build\Build-HuymaierReleaseCandidate.ps1 -TriggerPath '${{ steps.trigger.outputs.path }}'

      - name: Run installer and conflict failure-injection tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('hc-stage\${{ steps.trigger.outputs.package_root }}')
          $validation=Join-Path $env:HC_CANDIDATE_OUTPUT 'candidate-validation.json'
          & .\.build\Test-HuymaierCandidate.ps1 -StageRoot $stage -ValidationPath $validation

      - name: Upload exact candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trigger.outputs.candidate }}
          path: |
            ${{ env.HC_CANDIDATE_OUTPUT }}\${{ steps.trigger.outputs.asset }}
            ${{ env.HC_CANDIDATE_OUTPUT }}\${{ steps.trigger.outputs.asset }}.sha256
            ${{ env.HC_CANDIDATE_OUTPUT }}\candidate-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate build status
        if: always()
        shell: powershell
        env:
          BUILD_RESULT: ${{ job.status }}
          CANDIDATE: ${{ steps.trigger.outputs.candidate }}
          STATUS_PATH: ${{ steps.trigger.outputs.status }}
        run: |
          $ErrorActionPreference='Stop'
          # Never allow generated build outputs into the source-control commit.
          git reset -- FSEPackage/HuymaierFSEHost.exe 2>$null
          $state=[ordered]@{
            candidate=$env:CANDIDATE
            result=$env:BUILD_RESULT
            runId=$env:GITHUB_RUN_ID
            runAttempt=$env:GITHUB_RUN_ATTEMPT
            commit=$env:GITHUB_SHA
            recordedAtUtc=[DateTime]::UtcNow.ToString('o')
          }
          $state|ConvertTo-Json|Set-Content -LiteralPath $env:STATUS_PATH -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $env:STATUS_PATH
          if(-not (git diff --cached --quiet)){git commit -m "Record $env:CANDIDATE candidate build status";git push origin HEAD:${{ github.ref_name }}}
