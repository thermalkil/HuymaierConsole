name: Synchronize Huymaier Console v0.26.4 Source Manifest
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/source-manifest-request.json','.development/v0.26.4/apply_source_manifest.py','.github/workflows/materialize-v0264-source-manifest.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-source-manifest, cancel-in-progress: false}
jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Synchronize source entries
        run: python .development/v0.26.4/apply_source_manifest.py
      - name: Validate expansion sources are retained
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            Docs/PLATFORM-IMPLEMENTATION-STATUS-v0.26.4.md \
            EmulatorPlatforms/PSP/platform.json EmulatorPlatforms/3DS/platform.json \
            EmulatorPlatforms/Atari2600/platform.json EmulatorPlatforms/NES/platform.json EmulatorPlatforms/SNES/platform.json \
            EmulatorPlatforms/AtariLynx/platform.json EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/Jaguar/platform.json \
            EmulatorPlatforms/Arcade/platform.json EmulatorPlatforms/FinalBurnNeo/platform.json \
            EmulatorPlatforms/PS4/platform.json EmulatorPlatforms/Vita/platform.json \
            HuymaierEmulatorInstaller.ps1 HuymaierEmulatorSettings.ps1 HuymaierEmulatorSettingsWorker.ps1; do
            test -f "$path" || { echo "missing production path $path"; exit 1; }
            grep -Fxq "$path" .source/source-files.txt || { echo "source sync missing $path"; exit 1; }
          done
      - name: Commit source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source/source-files.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize v0.26.4 expansion source manifest'
          git fetch origin feature/v0.26.4-platform-expansion
          git rebase origin/feature/v0.26.4-platform-expansion
          git push origin HEAD:feature/v0.26.4-platform-expansion
