name: Apply RC9 Shader and Recomps Picker Fix

on:
  push:
    branches:
      - agent/v0265-rc9-shader-recomps-picker

permissions:
  contents: write

concurrency:
  group: huymaier-v0265-rc9-materializer
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0265-rc9-shader-recomps-picker
          fetch-depth: 0
      - name: Materialize RC9 fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $encoded=Get-Content -Raw '.\.development\v0.26.5\rc9-patch.py.gz.b64'
          $compressed=[Convert]::FromBase64String($encoded.Trim())
          $memory=New-Object IO.MemoryStream(,$compressed)
          $gzip=New-Object IO.Compression.GZipStream($memory,[IO.Compression.CompressionMode]::Decompress)
          $reader=New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
          try{$patch=$reader.ReadToEnd()}finally{$reader.Dispose();$gzip.Dispose();$memory.Dispose()}
          $tempPatch=Join-Path $env:RUNNER_TEMP 'Apply-Rc9ShaderPicker.py'
          [IO.File]::WriteAllText($tempPatch,$patch,(New-Object Text.UTF8Encoding($false)))
          python $tempPatch
          if($LASTEXITCODE -ne 0){throw "RC9 materializer failed with exit $LASTEXITCODE"}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'RC9 materialized diff failed git diff --check.'}
          $parseFiles=@(
            'HuymaierRecompsManual.ps1',
            '.development\v0.26.5\Test-v0265-RecompsExecutablePicker.ps1',
            '.development\v0.26.5\Test-v0265-D3D11ColorManagedShelfShader.ps1',
            '.build\Test-HuymaierV0265ManualRecompsCandidate.ps1',
            '.build\Test-HuymaierV0265PlatformModelsCandidate.ps1'
          )
          foreach($file in $parseFiles){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){throw "$file failed PowerShell 5.1 parse: $(@($errors|ForEach-Object{$_.Message}) -join '; ')"}
          }
      - name: Commit clean RC9 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if(-not (git status --porcelain)){throw 'RC9 materializer produced no source changes.'}
          git commit -m 'Fix model color pipeline and Recomps executable picker'
          git push origin HEAD:agent/v0265-rc9-shader-recomps-picker
