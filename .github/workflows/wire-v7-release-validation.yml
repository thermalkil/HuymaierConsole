name: Wire V7 GPU tests into release workflow
on:
  push:
    paths: ['.github/workflows/wire-v7-release-validation.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.5-performance-and-downloads, fetch-depth: 0}
      - name: Patch candidate workflow and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/build-v0265-request.yml')
          text=p.read_text(encoding='utf-8-sig')
          parse_anchor="""            '.\\.build\\Optimize-Platform3DModels.ps1',\n            '.\\.build\\Optimize-User3DModels.ps1',"""
          parse_new="""            '.\\.build\\Optimize-Platform3DModels.ps1',\n            '.\\.build\\Optimize-GpuPlatformShelves.ps1',\n            '.\\.build\\Optimize-User3DModels.ps1',"""
          if parse_anchor not in text: raise SystemExit('GPU transform parse anchor missing')
          text=text.replace(parse_anchor,parse_new,1)
          runtime_anchor="""            '.\\HuymaierLivePlatformModels.ps1',\n            '.\\HuymaierUser3DModels.ps1',"""
          runtime_new="""            '.\\HuymaierLivePlatformModels.ps1',\n            '.\\HuymaierUser3DModels.ps1',\n            '.\\HuymaierGpuPlatformShelves.ps1',"""
          if runtime_anchor not in text: raise SystemExit('V7 runtime parse anchor missing')
          text=text.replace(runtime_anchor,runtime_new,1)
          test_anchor="""            '.\\.development\\v0.26.5\\Test-v0265-User3DModels.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-Live3DCardRender.ps1'"""
          test_new="""            '.\\.development\\v0.26.5\\Test-v0265-User3DModels.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-Live3DCardRender.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-D3D11ShelfBackend.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-GpuShelfAssetCompiler.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-D3D11CachedModelRender.ps1',\n            '.\\.development\\v0.26.5\\Test-v0265-GpuPlatformShelvesV7.ps1'"""
          if test_anchor not in text: raise SystemExit('GPU source-test parse anchor missing')
          text=text.replace(test_anchor,test_new,1)
          reval_anchor="""            & '.\\.development\\v0.26.5\\Test-v0265-PlatformModels.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-User3DModels.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-Live3DCardRender.ps1'"""
          reval_new="""            & '.\\.development\\v0.26.5\\Test-v0265-PlatformModels.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-User3DModels.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-Live3DCardRender.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-D3D11ShelfBackend.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-GpuShelfAssetCompiler.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-D3D11CachedModelRender.ps1'\n            & '.\\.development\\v0.26.5\\Test-v0265-GpuPlatformShelvesV7.ps1'"""
          if reval_anchor not in text: raise SystemExit('GPU exact-source revalidation anchor missing')
          text=text.replace(reval_anchor,reval_new,1)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/wire-v7-release-validation.yml').unlink()
      - name: Commit release validation wiring
        shell: bash
        run: |
          git config user.name thermalkil
          git config user.email 98826286+thermalkil@users.noreply.github.com
          git add -A
          git commit -m 'Require V7 GPU shelves in requested-candidate source validation'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
