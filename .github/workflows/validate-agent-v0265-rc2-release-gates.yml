name: Validate v0.26.5 RC2 Release Gates

on:
  push:
    branches:
      - agent/v0265-rc2-release-gates

permissions:
  contents: read

concurrency:
  group: huymaier-v0265-rc2-release-gates
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release-gate PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Test-v0265-PowerShellSafety.ps1'
          foreach($p in @(
            '.\.build\Optimize-GpuPlatformShelves.ps1',
            '.\.build\Test-HuymaierV0265PlatformModelsCandidate.ps1',
            '.\.development\v0.26.5\Test-v0265-D3D11ShelfBackend.ps1',
            '.\.development\v0.26.5\Test-v0265-GpuPlatformShelvesV7.ps1'
          )){
            $t=$null;$e=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)
            if(@($e).Count){throw "$p failed PowerShell 5.1 parse: $(@($e|ForEach-Object{$_.Message}) -join '; ')"}
          }

      - name: Validate production GPU release gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Prepare-v0265-PlatformModelValidation.ps1'
          & '.\.development\v0.26.5\Test-v0265-PlatformModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-User3DModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11ShelfBackend.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuShelfAssetCompiler.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11CachedModelRender.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11UvAddressing.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuPlatformShelvesV7.ps1'
