name: Apply RC9 Runtime Deduplication Repair

on:
  push:
    branches:
      - agent/v0265-rc9-shader-recomps-picker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0265-rc9-shader-recomps-picker
      - name: Remove duplicated runtime state block
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='Native\HuymaierD3D11ShelfRuntime.cpp'
          $text=Get-Content -Raw -LiteralPath $path -Encoding UTF8
          $comment=$text.IndexOf('    // Shared-HLSL source contract lives in HuymaierD3D11ShelfAsset.h.',[StringComparison]::Ordinal)
          if($comment-lt0){throw 'Shared HLSL compatibility comment not found.'}
          $start=$text.IndexOf('    struct Constants',$comment,[StringComparison]::Ordinal)
          if($start-lt0){throw 'Duplicated Constants block not found.'}
          $endToken='    Core g_core;'
          $end=$text.IndexOf($endToken,$start,[StringComparison]::Ordinal)
          if($end-lt0){throw 'Duplicated Core terminator not found.'}
          $end += $endToken.Length
          while($end-lt$text.Length -and ($text[$end]-eq"`r" -or $text[$end]-eq"`n")){$end++}
          $text=$text.Substring(0,$start)+$text.Substring($end)
          if(([regex]::Matches($text,'(?m)^    struct Constants\r?$')).Count-ne1){throw 'Runtime must contain exactly one Constants block after repair.'}
          if(([regex]::Matches($text,'(?m)^    Core g_core;\r?$')).Count-ne1){throw 'Runtime must contain exactly one g_core after repair.'}
          [IO.File]::WriteAllText((Resolve-Path $path),$text,(New-Object Text.UTF8Encoding($false)))
          git diff --check
          if($LASTEXITCODE -ne0){throw 'Runtime dedup repair failed diff check.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'Remove duplicated D3D11 runtime state block'
          git push origin HEAD:agent/v0265-rc9-shader-recomps-picker
