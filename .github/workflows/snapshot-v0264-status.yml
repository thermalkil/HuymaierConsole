name: Snapshot Huymaier Console v0.26.4 Expansion Status
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/status-snapshot-request.json','.github/workflows/snapshot-v0264-status.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-status-snapshot, cancel-in-progress: true}
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Allow in-flight materializers to settle then fetch latest branch
        shell: powershell
        run: |
          Start-Sleep -Seconds 90
          git fetch origin feature/v0.26.4-platform-expansion
          git reset --hard origin/feature/v0.26.4-platform-expansion
      - name: Generate authoritative source snapshot
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('.')
          reg=json.loads((root/'EmulatorPlatforms/platform-registry.json').read_text(encoding='utf-8-sig'))
          enabled=sorted([str(x.get('id')) for x in reg.get('platforms',[]) if x.get('enabled')])
          staged=[]
          for folder in (root/'EmulatorPlatforms').iterdir():
              p=folder/'platform.json'
              if not p.exists():continue
              try:d=json.loads(p.read_text(encoding='utf-8-sig'))
              except:continue
              if not d.get('enabled'):staged.append({'folder':folder.name,'id':d.get('id'),'backend':d.get('primaryBackend'),'adapter':d.get('adapter')})
          files={name:(root/name).read_text(encoding='utf-8-sig') if (root/name).exists() else '' for name in ['Native/HuymaierConsole.ConsolePlatforms.cs','HuymaierEmulatorSettings.ps1','HuymaierEmulatorSettingsWorker.ps1','HuymaierEmulatorInstaller.ps1','HuymaierNativeConsoleLibraryWorker.ps1']}
          markers=['RenderWave2Settings','RenderWave2Storage','Get-StellaCliSettings','BuildStellaOverrideArguments','RenderWave3Settings','RenderWave3Storage','RenderArcadeOperatorSettings','RenderArcadeStorage','Get-MameCliSettings','BuildMameOverrideArguments','Get-HcJsonSettings','Get-HcTomlScalarSettings','Get-HcXmlSettings','RenderPs4DynamicMenu','RenderVitaLiveArea','RefreshModernPlayStationLibrary','RenderModernPlayStationSettings','RenderModernPlayStationStorage']
          joined='\n'.join(files.values())
          status={'schemaVersion':1,'branch':'feature/v0.26.4-platform-expansion','enabledPlatforms':enabled,'enabledCount':len(enabled),'stagedPlatforms':sorted(staged,key=lambda x:x['folder'].lower()),'markers':{m:(m in joined) for m in markers},'allMarkersPresent':all(m in joined for m in markers)}
          (root/'.development/v0.26.4/current-status.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,indent=2))
      - name: Parse production PowerShell and compile combined x64 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$files=@(Get-ChildItem -LiteralPath . -File -Filter '*.ps1')+@(Get-ChildItem -LiteralPath '.\Tools' -File -Filter '*.ps1' -ErrorAction SilentlyContinue);foreach($file in $files){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$($file.Name): $($_.Message)"};throw "PowerShell parse failed: $($file.Name)"}}
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-v0264-status.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne 0){throw 'Authoritative status x64 compile failed'}
      - name: Commit status snapshot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .development/v0.26.4/current-status.json;if(git diff --cached --quiet){exit 0};git commit -m 'Record authoritative v0.26.4 expansion source status';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Status snapshot rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Status snapshot push failed'}
