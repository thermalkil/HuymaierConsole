name: Apply Shared D3D11 Model Viewer
on:
  push:
    branches: [agent/v0265-recomps-wpf-render-fix]
    paths:
      - '.development/v0.26.5/Apply-v0265-UnifiedGpuViewer.py'
      - '.github/workflows/apply-agent-unified-gpu-viewer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0265-recomps-wpf-render-fix
          fetch-depth: 0
      - name: Apply viewer transformations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python '.\.development\v0.26.5\Apply-v0265-UnifiedGpuViewer.py'
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierLivePlatformModels.ps1'),[ref]$t,[ref]$e)
          if($e.Count){$e|ForEach-Object{Write-Host ("line {0}:{1} {2}" -f $_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message)};throw 'Unified GPU viewer failed PowerShell 5.1 parse.'}
      - name: Compile shared native renderer and managed host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not$vs){throw 'MSVC x64 tools unavailable.'}
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $nativeDll=Join-Path $env:RUNNER_TEMP 'HuymaierD3D11ShelfRenderer.dll'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-viewer.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /LD /O2 /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE /I"%GITHUB_WORKSPACE%\Native" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfRenderer.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfAsset.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfRuntime.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11UvAddressSmoke.cpp" /link /OUT:"$nativeDll" d3d11.lib d3d9.lib d3dcompiler.lib dxgi.lib user32.lib ole32.lib
          exit /b %errorlevel%
          "@|Set-Content -LiteralPath $cmd -Encoding ASCII
          &cmd.exe /d /c ('"'+$cmd+'"')
          if($LASTEXITCODE-ne0-or-not(Test-Path $nativeDll)){throw 'Unified viewer native renderer compilation failed.'}
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $framework=[Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()
          $out=Join-Path $env:RUNNER_TEMP 'HuymaierGpuShelfHost.dll'
          $refs=@([ComponentModel.ISupportInitialize].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,(Join-Path $framework 'System.Xaml.dll'))|Select-Object -Unique
          $args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+='.\Native\HuymaierD3D11ShelfHost.cs'
          & $csc @args
          if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'Unified viewer D3D11 WPF host compilation failed.'}
      - name: Validate viewer ownership contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $viewer=Get-Content -Raw '.\HuymaierLivePlatformModels.ps1' -Encoding UTF8
          foreach($n in @('HUYMAIER_SHARED_D3D11_MODEL_VIEWER_V1','Get-HcModelViewerGpuCache','Get-HcGpuShelfHostType','SetItemView(0','$script:HcGpuShelfCompilerExe','Update-HcGpuModelViewerItem')){if($viewer.IndexOf($n,[StringComparison]::Ordinal)-lt0){throw "Unified viewer contract missing: $n"}}
          $openStart=$viewer.IndexOf('function Open-HcPlatformModelViewer {',[StringComparison]::Ordinal)
          $openEnd=$viewer.IndexOf('function Invoke-SecondaryAction {',[StringComparison]::Ordinal)
          if($openStart-lt0-or$openEnd-le$openStart){throw 'Could not inspect full-screen viewer implementation.'}
          $open=$viewer.Substring($openStart,$openEnd-$openStart)
          if($open.Contains('New-HcLiveModelView')){throw 'Full-screen viewer still creates the divergent WPF GLB renderer.'}
          $native=Get-Content -Raw '.\Native\HuymaierD3D11ShelfRuntime.cpp' -Encoding UTF8
          foreach($n in @('HC_GPU_SetShelfItemView','item.spin?phase*16.0f:0.0f','item.yawOffset','item.pitch')){if($native.IndexOf($n,[StringComparison]::Ordinal)-lt0){throw "Native shared viewer state missing: $n"}}
          $hostText=Get-Content -Raw '.\Native\HuymaierD3D11ShelfHost.cs' -Encoding UTF8
          foreach($n in @('HC_GPU_SetShelfItemView','public bool SetItemView','YawOffset','Pitch = -10.0f','Spin = true')){if($hostText.IndexOf($n,[StringComparison]::Ordinal)-lt0){throw "Managed shared viewer state missing: $n"}}
          Write-Host 'platformModelFullViewerSharedD3D11Gate: success'
          Write-Host 'platformModelFullViewerSameHc3dMaterialPathGate: success'
      - name: Commit materialized viewer
        shell: powershell
        run: |
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add Native/HuymaierD3D11ShelfRuntime.cpp Native/HuymaierD3D11ShelfHost.cs HuymaierLivePlatformModels.ps1
          if(git diff --cached --quiet){exit 0}
          git commit -m 'Unify full-screen model viewer with D3D11 shelf renderer'
          git push origin HEAD:agent/v0265-recomps-wpf-render-fix
