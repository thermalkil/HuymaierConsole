name: Require V7 DPI-aware GPU bridge
on:
  push:
    paths: ['.github/workflows/add-v7-dpi-gate.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.5-performance-and-downloads, fetch-depth: 0}
      - name: Add DPI validation and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.development/v0.26.5/Test-v0265-GpuPlatformShelvesV7.ps1')
          text=p.read_text(encoding='utf-8-sig')
          old="foreach($n in @('HUYMAIER_D3D11_SHELF_HOST_V2','D3DImage','ReplayState','CompositionTarget.Rendering','modelPaths','itemStates'))"
          new="foreach($n in @('HUYMAIER_D3D11_SHELF_HOST_V2','HUYMAIER_D3D11_DPI_AWARE_SHELF_V1','D3DImage','ReplayState','CompositionTarget.Rendering','VisualTreeHelper.GetDpi','dpiScaleX','dpiScaleY','PixelWidthFor','PixelHeightFor','ApplyItemToNative','modelPaths','itemStates'))"
          if old not in text: raise SystemExit('V7 host validation anchor not found')
          text=text.replace(old,new,1)
          oldgate="'platformModelV7InstallerPayloadGate'"
          newgate="'platformModelV7InstallerPayloadGate','platformModelD3D11DpiAwareShelfGate'"
          if oldgate not in text: raise SystemExit('V7 gate output anchor not found')
          text=text.replace(oldgate,newgate,1)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/add-v7-dpi-gate.yml').unlink()
      - name: Commit DPI gate
        shell: bash
        run: |
          git config user.name thermalkil
          git config user.email 98826286+thermalkil@users.noreply.github.com
          git add -A
          git commit -m 'Require DPI-aware D3D11 shelf coordinates in V7 validation'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
