name: Enable Huymaier Console v0.26.4 Wave 2 Platforms
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/wave2-enable-request.json','.development/v0.26.4/apply_wave2_enable.py','.github/workflows/materialize-v0264-wave2-enable.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-wave2-enable, cancel-in-progress: false}
jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Ensure Wave 2 prerequisites and graduate platforms
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $worker=Get-Content -Raw 'HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;if($worker -notmatch [regex]::Escape('function Get-StellaCliSettings')){python .development\v0.26.4\apply_stella_cli_adapter.py;if($LASTEXITCODE){throw 'Stella prerequisite failed'}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;if($native -notmatch [regex]::Escape('private void RenderWave2Settings()')){python .development\v0.26.4\apply_wave2_storage_settings.py;if($LASTEXITCODE){throw 'Wave2 storage prerequisite failed'}}
          python .development\v0.26.4\apply_wave2_enable.py;if($LASTEXITCODE){throw 'Wave2 enablement materializer failed'}
          python .development\v0.26.4\apply_source_manifest.py;if($LASTEXITCODE){throw 'Source manifest sync failed'}
      - name: Validate enabled Wave 2 settings install storage navigation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$registry=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json
          foreach($id in @('atari2600','nes','snes','gameboy','gbc','gba','genesis','segacd','sega32x','gamegear','mastersystem','turbografx16')){$entry=@($registry.platforms|Where-Object{$_.id -eq $id});if($entry.Count -ne 1 -or -not [bool]$entry[0].enabled){throw "Wave2 not enabled exactly once: $id"};foreach($cap in @('latest-emulator-install','native-full-emulator-settings','unknown-setting-preservation','native-save-management','alphabet-index')){if(@($entry[0].capabilities) -notcontains $cap){throw "$id missing $cap"}}}
          foreach($pair in @(@('Atari2600','stella'),@('NES','mesence'),@('SNES','mesence'),@('GameBoy','mesence'),@('GBC','mesence'),@('GBA','mgba'),@('Genesis','ares'),@('SegaCD','ares'),@('Sega32X','ares'),@('GameGear','mesence'),@('MasterSystem','mesence'),@('TurboGrafx16','mednafen'))){$d=Get-Content -Raw (Join-Path (Join-Path 'EmulatorPlatforms' $pair[0]) 'platform.json') -Encoding UTF8|ConvertFrom-Json;if(-not [bool]$d.enabled -or [string]$d.adapter -ne $pair[1]){throw "$($pair[0]) adapter/enablement invalid"};if(-not [string]::IsNullOrWhiteSpace([string]$d.fallbackBackend)){throw "$($pair[0]) still exposes an unaudited fallback backend."}}
          $w=Get-Content -Raw 'HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;foreach($m in @('Get-StellaCliSettings',"'mesence'", "'mgba'", "'ares'", "'mednafen'")){if($w -notmatch [regex]::Escape($m)){throw "Wave2 settings marker missing: $m"}}
          $n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('RenderWave2Settings','RenderWave2Storage','bool wave2 = IsWave2Shell()')){if($n -notmatch [regex]::Escape($m)){throw "Wave2 native marker missing: $m"}};if($n -match 'LeftShoulder[^\r\n]{0,200}SwitchPage' -or $n -match 'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulders switch pages.'}
      - name: Parse PowerShell and compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';foreach($path in @('.\HuymaierEmulatorInstaller.ps1','.\HuymaierEmulatorSettings.ps1','.\HuymaierEmulatorSettingsWorker.ps1','.\HuymaierNativeConsoleLibraryWorker.ps1')){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$path : $($_.Message)"};throw "$path parse failed."}}
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-wave2-enable.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave2 graduation x64 compile failed.'}
      - name: Keep frozen PlayStation source untouched
        shell: powershell
        run: |
          git diff --quiet 9f3b5b390dd24f82ecce129c1e25dbc97bf598a5 -- Native/HuymaierConsole.Ps1.cs EmulatorPlatforms/PS1 EmulatorPlatforms/PS2 EmulatorPlatforms/PS3;if($LASTEXITCODE -ne 0){throw 'Frozen PS source changed.'}
      - name: Commit validated Wave 2 graduation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add -A;if(git diff --cached --quiet){exit 0};git commit -m 'Enable validated v0.26.4 Wave 2 hardware platforms';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave2 graduation rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave2 graduation push failed.'}
