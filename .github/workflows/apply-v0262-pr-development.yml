name: Apply v0.26.2 PR Development Batch

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v0262-pr-development
  cancel-in-progress: false

jobs:
  apply-development:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/v0.26.2-customization-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact v0.26.2 development branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.26.2-customization-runtime
          fetch-depth: 0

      - name: Apply requested deterministic batch
        shell: bash
        run: |
          set -euo pipefail
          DEV='.development/v0.26.2'
          APPLY="$DEV/apply.json"
          STATUS="$DEV/status.json"
          test -f "$APPLY"
          BATCH="$(python3 -c "import json;print(json.load(open('$APPLY'))['batch'])")"
          SCRIPT="$(python3 -c "import json;print(json.load(open('$APPLY')).get('script',''))")"
          PATCH_DIR="$(python3 -c "import json;print(json.load(open('$APPLY')).get('patch_dir',''))")"
          LAST=''
          if [ -f "$STATUS" ]; then
            LAST="$(python3 -c "import json;print(json.load(open('$STATUS')).get('batch',''))")"
          fi
          if [ "$LAST" = "$BATCH" ]; then
            echo "Development batch $BATCH is already applied."
            exit 0
          fi

          if [ -n "$SCRIPT" ]; then
            test -f "$DEV/$SCRIPT"
            python3 "$DEV/$SCRIPT"
          elif [ -n "$PATCH_DIR" ]; then
            shopt -s nullglob
            patches=("$PATCH_DIR"/*.patch)
            test "${#patches[@]}" -gt 0
            for patch in "${patches[@]}"; do git apply --check --whitespace=nowarn "$patch"; done
            for patch in "${patches[@]}"; do git apply --whitespace=nowarn "$patch"; done
          else
            echo 'apply.json requires script or patch_dir.'
            exit 1
          fi

          python3 - <<PY
          import json,datetime
          state={
            'batch':'$BATCH',
            'script':'$SCRIPT',
            'patch_dir':'$PATCH_DIR',
            'result':'success',
            'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('$STATUS','w',encoding='utf-8').write(json.dumps(state,indent=2)+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "Apply v0.26.2 development batch $BATCH"
          git push origin HEAD:feature/v0.26.2-customization-runtime
