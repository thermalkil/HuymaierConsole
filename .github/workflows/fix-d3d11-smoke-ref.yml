name: Fix D3D11 bridge framework reference

on:
  push:
    paths:
      - '.github/workflows/fix-d3d11-smoke-ref.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Add System assembly reference and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.development/v0.26.5/Test-v0265-D3D11ShelfBackend.ps1')
          text=p.read_text(encoding='utf-8-sig')
          old="$refs=@([Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,(Join-Path $framework 'System.Xaml.dll'))|Select-Object -Unique"
          new="$refs=@([ComponentModel.ISupportInitialize].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,(Join-Path $framework 'System.Xaml.dll'))|Select-Object -Unique"
          if old not in text: raise SystemExit('Managed D3D11 reference anchor not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-d3d11-smoke-ref.yml').unlink()
      - name: Commit reference correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Reference System assembly in D3D11 WPF bridge smoke build'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
