name: Stage Huymaier Console v0.26.4 Arcade and Modern PlayStation

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave45-stage-request.json'
      - '.development/v0.26.4/apply_wave45_stage.py'
      - '.development/v0.26.4/apply_wave45_compile_fixes.py'
      - '.github/workflows/materialize-v0264-wave45-stage.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-wave45-stage
  cancel-in-progress: false

jobs:
  stage-and-compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize Arcade, FBNeo, PS4 and Vita surfaces
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if(-not(Test-Path 'EmulatorPlatforms\Arcade\platform.json') -or $native -notmatch [regex]::Escape('private bool IsWave45Shell()')){python .development\v0.26.4\apply_wave45_stage.py;if($LASTEXITCODE -ne 0){throw 'Wave 4/5 staging materializer failed.'}}
          python .development\v0.26.4\apply_wave45_compile_fixes.py;if($LASTEXITCODE -ne 0){throw 'Wave 4/5 compile correction failed.'}
      - name: Validate staged platform definitions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($folder in @('Arcade','FinalBurnNeo','PS4','Vita')){$p=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'platform.json';$s=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'settings.default.json';if(-not(Test-Path $p)-or-not(Test-Path $s)){throw "Missing staged platform $folder"};$d=Get-Content -Raw $p -Encoding UTF8|ConvertFrom-Json;if([bool]$d.enabled){throw "$folder must remain disabled until backend/settings/storage completion."}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          foreach($marker in @('RenderArcadeCabinet','RenderFbNeoBoard','RenderPs4DynamicMenu','RenderVitaLiveArea')){if($native -notmatch [regex]::Escape($marker)){throw "Missing staged native surface $marker"}}
          if($native -match [regex]::Escape('WrapPanel cards=new WrapPanel;')){throw 'Invalid WrapPanel constructor remains.'}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave45.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave 4/5 x64 native compile failed.'}
      - name: Commit validated staged source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/Arcade EmulatorPlatforms/FinalBurnNeo EmulatorPlatforms/PS4 EmulatorPlatforms/Vita;if(git diff --cached --quiet){Write-Host 'No staged Wave 4/5 changes.';exit 0};git commit -m 'Stage v0.26.4 Arcade PS4 and Vita native surfaces';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 4/5 staging rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 4/5 staging push failed.'}
