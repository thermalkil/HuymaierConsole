name: Apply RC9 Packaged Shader Contract Embedding

on:
  push:
    branches:
      - feature/v0.26.5-performance-and-downloads

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
      - name: Embed contract marker inside production HLSL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='Native\HuymaierD3D11ShelfAsset.h'
          $text=Get-Content -Raw -LiteralPath $path -Encoding UTF8
          $needle='static const char* HcShelfShaderSource = R"HLSL('
          if(-not$text.Contains($needle)){throw 'Shared shelf HLSL declaration not found.'}
          $embedded='// HUYMAIER_D3D11_SHELF_SHADER_V4_COLOR_MANAGED_UI_PBR'
          $after=$text.Substring($text.IndexOf($needle)+$needle.Length)
          if($after.TrimStart().StartsWith($embedded)){throw 'Packaged shader contract marker is already embedded.'}
          $replacement=$needle+"`r`n    "+$embedded
          $text=$text.Replace($needle,$replacement)
          [IO.File]::WriteAllText((Resolve-Path $path),$text,(New-Object Text.UTF8Encoding($false)))
          if(([regex]::Matches($text,[regex]::Escape($embedded))).Count-lt2){throw 'Shader contract marker was not embedded into HLSL.'}
          git diff --check
          if($LASTEXITCODE-ne0){throw 'Embedded shader contract change failed diff check.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'Embed color-managed shader contract in runtime HLSL'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
