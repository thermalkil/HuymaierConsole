name: Enable Huymaier Console v0.26.4 Arcade Platforms
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/arcade-enable-request.json','.development/v0.26.4/apply_mame_release_resolver.py','.development/v0.26.4/apply_fbneo_native_integration.py','.development/v0.26.4/apply_fbneo_first_run_settings.py','.development/v0.26.4/apply_arcade_enable.py','.github/workflows/materialize-v0264-arcade-enable.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-arcade-enable, cancel-in-progress: false}
jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize architecture-correct MAME resolver
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .development\v0.26.4\apply_mame_release_resolver.py;if($LASTEXITCODE){throw 'MAME release resolver materializer failed'};$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierEmulatorInstaller.ps1'),[ref]$t,[ref]$e);if($e.Count){throw 'MAME resolver source failed PowerShell 5.1 parsing'}
      - name: Live-install and interrogate current MAME
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root=Join-Path $env:RUNNER_TEMP 'hc-mame-live';New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId ARCADE -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$r=$json|ConvertFrom-Json;$exe=[string]$r.Executable;if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'MAME installer did not return a valid executable'};$bytes=[IO.File]::ReadAllBytes($exe);$pe=[BitConverter]::ToInt32($bytes,0x3c);if([BitConverter]::ToUInt16($bytes,$pe+4)-ne0x8664){throw 'Current MAME executable is not x64'};$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$exe;$psi.Arguments='-showconfig';$psi.WorkingDirectory=Split-Path -Parent $exe;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$stdout=$p.StandardOutput.ReadToEnd();$stderr=$p.StandardError.ReadToEnd();if(-not$p.WaitForExit(15000)){try{$p.Kill()}catch{};throw 'MAME -showconfig timed out'};if($stdout-notmatch'(?im)^\s*rompath\s'){throw 'Current MAME -showconfig did not expose rompath'};Write-Host ('MAME live settings lines: '+(($stdout-split"`r?`n").Count))
      - name: Live-install and initialize current FBNeo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root=Join-Path $env:RUNNER_TEMP 'hc-fbneo-live';New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId NEOGEO -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$r=$json|ConvertFrom-Json;$exe=[string]$r.Executable;if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'FBNeo installer did not return a valid executable'};$bytes=[IO.File]::ReadAllBytes($exe);$pe=[BitConverter]::ToInt32($bytes,0x3c);if([BitConverter]::ToUInt16($bytes,$pe+4)-ne0x8664){throw 'Current FBNeo executable is not x64'};$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$exe;$psi.Arguments='-listinfo';$psi.WorkingDirectory=Split-Path -Parent $exe;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$outTask=$p.StandardOutput.ReadToEndAsync();$errTask=$p.StandardError.ReadToEndAsync();if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'FBNeo -listinfo timed out'};try{$null=$outTask.Result;$null=$errTask.Result}catch{};$config=Join-Path (Split-Path -Parent $exe) ('config\'+[IO.Path]::GetFileNameWithoutExtension($exe)+'.ini');if(-not(Test-Path -LiteralPath $config -PathType Leaf)){throw "FBNeo -listinfo did not generate $config"};$raw=Get-Content -Raw $config -Encoding UTF8;if($raw-notmatch'(?m)^szAppRomPaths\[0\]\s+'-or$raw-notmatch'(?m)^nVidVSync\s+'){throw 'FBNeo generated config is incomplete'};Write-Host ('FBNeo generated config bytes: '+(Get-Item $config).Length)
      - name: Materialize native FBNeo and arcade integration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .development\v0.26.4\apply_fbneo_native_integration.py;if($LASTEXITCODE){throw 'FBNeo native integration failed'};python .development\v0.26.4\apply_fbneo_first_run_settings.py;if($LASTEXITCODE){throw 'FBNeo first-run settings integration failed'};python .development\v0.26.4\apply_arcade_enable.py;if($LASTEXITCODE){throw 'Arcade graduation failed'};python .development\v0.26.4\apply_source_manifest.py;if($LASTEXITCODE){throw 'Source manifest sync failed'}
      - name: Prove FBNeo preservation and arcade launch semantics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';foreach($p in @('.\HuymaierEmulatorInstaller.ps1','.\HuymaierEmulatorSettings.ps1','.\HuymaierEmulatorSettingsWorker.ps1')){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$p : $($_.Message)"};throw "$p parse failed"}}
          $installer=Get-Content -Raw '.\HuymaierEmulatorInstaller.ps1' -Encoding UTF8;if($installer-notmatch[regex]::Escape("Get-GithubReleaseAsset 'mamedev/mame'")){throw 'MAME shared release resolver missing'};if($installer-match'Get-GithubLatestAssets'){throw 'Stale undefined MAME release helper remains'}
          $core=Get-Content -Raw '.\HuymaierEmulatorSettings.ps1' -Encoding UTF8;if($core-notmatch[regex]::Escape("AdapterId -ieq 'fbneo'")){throw 'FBNeo key/value format adapter missing'};$worker=Get-Content -Raw '.\HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;foreach($m in @('Initialize-FbNeoConfigIfNeeded','config\fbneo64.ini')){if($worker-notmatch[regex]::Escape($m)){throw "FBNeo worker marker missing $m"}}
          $test=Join-Path $env:RUNNER_TEMP 'fbneo-preserve.ini';@('// preserved comment','nVidVSync 1','FutureUnknownOption 987','szAppRomPaths[0] X:\ROMs\')|Set-Content -LiteralPath $test -Encoding UTF8;$script:BaseDir=(Resolve-Path '.').Path;function Write-Log{};function Get-EntryProperty{param($Object,[string]$Name,$Default=$null);if($null-ne$Object){$p=$Object.PSObject.Properties[$Name];if($p){return $p.Value}};return $Default};. .\HuymaierEmulatorSettings.ps1;$items=@(Get-HcEmulatorConfigSettings -AdapterId 'fbneo' -Path $test);$target=@($items|Where-Object{$_.Key-eq'nVidVSync'}|Select-Object -First 1);if(-not$target){throw 'FBNeo key/value inventory did not find nVidVSync'};Set-HcEmulatorConfigSetting -Setting $target -Value '0';$after=Get-Content -Raw $test -Encoding UTF8;if($after-notmatch'(?m)^nVidVSync 0$'-or$after-notmatch'FutureUnknownOption 987'-or$after-notmatch'// preserved comment'){throw 'FBNeo key/value edit did not preserve unknown/comment lines'}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('EnsureFbNeoRomPath','return driver;','BuildMameOverrideArguments','-rompath','RenderArcadeOperatorSettings','RenderArcadeStorage')){if($native-notmatch[regex]::Escape($m)){throw "Arcade native marker missing $m"}};if($native-match'LeftShoulder[^\r\n]{0,200}SwitchPage'-or$native-match'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulder buttons switch arcade pages'}
          $reg=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json;foreach($id in @('arcade','finalburnneo','neogeo')){$e=@($reg.platforms|Where-Object{$_.id-eq$id});if($e.Count-ne1-or-not[bool]$e[0].enabled){throw "$id not enabled exactly once"};foreach($cap in @('latest-emulator-install','native-full-emulator-settings','native-save-management','operator-settings')){if(@($e[0].capabilities)-notcontains$cap){throw "$id missing $cap"}}}
      - name: Compile exact x64 combined native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-arcade-enable.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'Arcade graduation x64 compile failed'}
      - name: Commit validated arcade graduation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorInstaller.ps1 Native/HuymaierConsole.ConsolePlatforms.cs HuymaierEmulatorSettings.ps1 HuymaierEmulatorSettingsWorker.ps1 EmulatorPlatforms/Arcade/platform.json EmulatorPlatforms/FinalBurnNeo/platform.json EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/platform-registry.json manifest.json .source/source-files.txt;if(git diff --cached --quiet){exit 0};git commit -m 'Enable validated v0.26.4 Arcade FBNeo and Neo Geo platforms';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Arcade graduation rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Arcade graduation push failed'}
