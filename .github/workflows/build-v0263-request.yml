name: Build Huymaier Console v0.26.3 Requested Candidate

on:
  push:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.3/candidate-request.json'

permissions:
  contents: write

concurrency:
  group: huymaier-v0263-requested-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out exact requested source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize pending console source batch
        id: materialize
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -Raw -LiteralPath 'manifest.json' -Encoding UTF8|ConvertFrom-Json
          if([string]$manifest.build -eq 'native-console-fidelity-rc4'){
            'changed=false'|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'RC4 production source is already materialized.'
            exit 0
          }
          if([string]$manifest.build -eq 'native-console-fidelity-rc3'){
            $transformer='.development\v0.26.3\apply_rc4_feedback.py'
            if(-not(Test-Path -LiteralPath $transformer -PathType Leaf)){throw 'RC4 user-feedback materializer is missing.'}
            python $transformer
            if($LASTEXITCODE -ne 0){throw 'RC4 user-feedback materializer failed.'}
            $state=[ordered]@{batch='console-fidelity-rc4-user-feedback';script='apply_rc4_feedback.py';result='success';recordedAtUtc=[DateTime]::UtcNow.ToString('o')}
            $state|ConvertTo-Json|Set-Content -LiteralPath '.development\v0.26.3\status.json' -Encoding UTF8
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if(git diff --cached --quiet){throw 'RC4 patcher reported work but produced no materialized changes.'}
            git commit -m 'Materialize v0.26.3 RC4 user feedback source'
            git push origin HEAD:feature/v0.26.3-console-fidelity
            if($LASTEXITCODE -ne 0){throw 'Could not push materialized RC4 source.'}
            'changed=true'|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'RC4 source was committed. Touch candidate-request.json again to build from the exact new SHA.'
            exit 0
          }
          $transformer='.development\v0.26.3\apply_rc3_patch_v2.py'
          if(-not(Test-Path -LiteralPath $transformer -PathType Leaf)){throw 'RC3 checksum-verified v2 production patcher is missing.'}
          python $transformer
          if($LASTEXITCODE -ne 0){throw 'RC3 checksum-verified v2 production patch failed.'}
          $state=[ordered]@{batch='console-fidelity-4-authentic-integration-v2';script='apply_rc3_patch_v2.py';patchSha256='f6ca760aade9136b9c830b61d7eec34473e50a24a64c245e450d0be1e5b9a98c';result='success';recordedAtUtc=[DateTime]::UtcNow.ToString('o')}
          $state|ConvertTo-Json|Set-Content -LiteralPath '.development\v0.26.3\status.json' -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if(git diff --cached --quiet){throw 'Patcher reported pending RC3 source but produced no materialized changes.'}
          git commit -m 'Materialize v0.26.3 authentic console production source v2'
          git push origin HEAD:feature/v0.26.3-console-fidelity
          if($LASTEXITCODE -ne 0){throw 'Could not push materialized RC3 source.'}
          'changed=true'|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'Materialized source was committed. A fresh candidate request must build from that exact new SHA.'

      - name: Read request
        if: steps.materialize.outputs.changed != 'true'
        id: request
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='.development\v0.26.3\candidate-request.json'
          $data=Get-Content -Raw -LiteralPath $path -Encoding UTF8|ConvertFrom-Json
          foreach($required in @('candidate','version','base_release','base_asset','package_root','asset_name')){if([string]::IsNullOrWhiteSpace([string]$data.$required)){throw "Candidate request is missing $required"}}
          if([string]$data.version -ne '0.26.3'){throw 'v0.26.3 candidate workflow received a different version.'}
          if([string]$data.base_release -ne 'v0.26.2' -or [string]$data.base_asset -ne 'HC262.zip'){throw 'v0.26.3 must stage from the published v0.26.2 / HC262.zip baseline.'}
          if([string]$data.package_root -ne 'HC263' -or [string]$data.asset_name -ne 'HC263.zip'){throw 'v0.26.3 candidate package identity is not HC263.'}
          "path=$path"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate=$([string]$data.candidate)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$([string]$data.asset_name)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_root=$([string]$data.package_root)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build exact x64 FSE Home host
        if: steps.materialize.outputs.changed != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not(Test-Path -LiteralPath $csc)){throw 'Framework64 csc.exe was not found.'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'HuymaierFSEHost.cs'
          $output=Join-Path $env:GITHUB_WORKSPACE 'FSEPackage\HuymaierFSEHost.exe'
          $systemAssembly=[System.Diagnostics.Process].Assembly.Location
          if(-not(Test-Path -LiteralPath $source -PathType Leaf) -or -not(Test-Path -LiteralPath $systemAssembly -PathType Leaf)){throw 'Deterministic FSE compile dependency is missing.'}
          & $csc /noconfig /nologo /target:winexe /platform:x64 /optimize+ ('/reference:'+$systemAssembly) ('/out:'+$output) $source
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $output -PathType Leaf)){throw 'x64 FSE Home host compilation failed.'}
          git add -N -f FSEPackage/HuymaierFSEHost.exe

      - name: Build exact release-shaped candidate
        if: steps.materialize.outputs.changed != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & .\.build\Build-HuymaierReleaseCandidate.ps1 -TriggerPath '${{ steps.request.outputs.path }}'

      - name: Run inherited installer and integrity failure-injection suite
        if: steps.materialize.outputs.changed != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('hc-stage\${{ steps.request.outputs.package_root }}')
          $validation=Join-Path $env:HC_CANDIDATE_OUTPUT 'candidate-validation.json'
          & .\.build\Test-HuymaierCandidate.ps1 -StageRoot $stage -ValidationPath $validation

      - name: Run v0.26.3 authentic console and inherited v0.26.2 gates
        if: steps.materialize.outputs.changed != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('hc-stage\${{ steps.request.outputs.package_root }}')
          $validation=Join-Path $env:HC_CANDIDATE_OUTPUT 'candidate-validation.json'
          & .\.build\Test-HuymaierV0263Candidate.ps1 -StageRoot $stage -ValidationPath $validation

      - name: Run Steam owned-library behavior tests
        if: steps.materialize.outputs.changed != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('hc-stage\${{ steps.request.outputs.package_root }}')
          $validation=Join-Path $env:HC_CANDIDATE_OUTPUT 'candidate-validation.json'
          & .\.build\Test-HuymaierV0262SteamOwnership.ps1 -StageRoot $stage -ValidationPath $validation

      - name: Upload exact candidate bytes
        if: steps.materialize.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.candidate }}
          path: |
            ${{ env.HC_CANDIDATE_OUTPUT }}\${{ steps.request.outputs.asset }}
            ${{ env.HC_CANDIDATE_OUTPUT }}\${{ steps.request.outputs.asset }}.sha256
            ${{ env.HC_CANDIDATE_OUTPUT }}\candidate-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Record requested candidate status
        if: always() && steps.materialize.outputs.changed != 'true'
        shell: powershell
        env:
          BUILD_RESULT: ${{ job.status }}
          CANDIDATE: ${{ steps.request.outputs.candidate }}
        run: |
          $ErrorActionPreference='Stop'
          git reset -- FSEPackage/HuymaierFSEHost.exe 2>$null
          $status=[ordered]@{candidate=$env:CANDIDATE;result=$env:BUILD_RESULT;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;commit=$env:GITHUB_SHA;recordedAtUtc=[DateTime]::UtcNow.ToString('o')}
          $status|ConvertTo-Json|Set-Content -LiteralPath '.development\v0.26.3\candidate-status.json' -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.development\v0.26.3\candidate-status.json'
          if(-not(git diff --cached --quiet)){git commit -m "Record $env:CANDIDATE requested candidate status";git push origin HEAD:feature/v0.26.3-console-fidelity}
