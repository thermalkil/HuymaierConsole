name: Fix GPU shelf transform architecture anchor

on:
  push:
    paths:
      - '.github/workflows/fix-gpu-transform-anchor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Replace escaped anchor with literal here-string and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.build/Optimize-GpuPlatformShelves.ps1')
          text=p.read_text(encoding='utf-8-sig')
          start=text.find('    $archAnchor="')
          end=text.find("    if(-not$builder.Contains($archAnchor))", start)
          if start < 0 or end < 0: raise SystemExit('GPU architecture anchor block not found')
          replacement="""    $archAnchor=@'\n$liveModelHeaders=(& $dumpbin /nologo /headers $liveModelDll) -join \"`n\";if($liveModelHeaders -notmatch '(?i)machine \\(x64\\)|8664 machine'){throw 'HuymaierLiveModel3D.dll is not x64.'}\n'@\n"""
          text=text[:start]+replacement+text[end:]
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/fix-gpu-transform-anchor.yml').unlink()
      - name: Commit transform parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PowerShell 5.1 GPU shelf transform architecture anchor'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
