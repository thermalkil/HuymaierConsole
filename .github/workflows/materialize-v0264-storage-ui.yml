name: Materialize Huymaier Console v0.26.4 Wave 1 Storage UI

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/storage-ui-request.json'
      - '.development/v0.26.4/apply_wave1_native_storage_ui.py'
      - '.github/workflows/materialize-v0264-storage-ui.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-storage-ui
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize native Wave 1 storage managers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $native=Get-Content -Raw -LiteralPath 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if($native -notmatch [regex]::Escape('private void RenderPspSavedDataUtility()')){
            python .development\v0.26.4\apply_wave1_native_storage_ui.py
            if($LASTEXITCODE -ne 0){throw 'Wave 1 native storage materializer failed.'}
          }else{Write-Host 'Wave 1 native storage managers already materialized.'}
      - name: Validate native storage invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          foreach($required in @('RenderPspSavedDataUtility','ReadPspSfoString','PARAM.SFO','ICON0.PNG','RenderDreamcastVmuManager','vmu_save_*.bin','RenderSaturnMemoryManager','RenderDsSavedData','FindDsSidecarSaves','Render3dsDataManagement','BackupNativeSavePath')){if($native -notmatch [regex]::Escape($required)){throw "Wave 1 native storage invariant missing: $required"}}
          if($native -match [regex]::Escape('titleText.Text=definition.Shell=="Dreamcast"?"File":(definition.Shell=="Saturn"?"Memory Manager":"Saved Data")')){throw 'Wave 1 storage is still the old generic root-folder renderer.'}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $automation=[Management.Automation.PSObject].Assembly.Location
          $refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs')
          $out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-storage.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $out)){throw 'Wave 1 native storage x64 compile failed.'}
      - name: Commit validated storage managers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Native/HuymaierConsole.ConsolePlatforms.cs
          if(git diff --cached --quiet){Write-Host 'No storage source changes to commit.';exit 0}
          git commit -m 'Materialize v0.26.4 Wave 1 native storage managers'
          git fetch origin feature/v0.26.4-platform-expansion
          git rebase origin/feature/v0.26.4-platform-expansion
          if($LASTEXITCODE -ne 0){throw 'Could not rebase Wave 1 storage commit.'}
          git push origin HEAD:feature/v0.26.4-platform-expansion
          if($LASTEXITCODE -ne 0){throw 'Could not push Wave 1 storage commit.'}
