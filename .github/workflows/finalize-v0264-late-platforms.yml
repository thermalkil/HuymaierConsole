name: Finalize Huymaier Console v0.26.4 Late Platforms
on:
  push:
    branches: [feature/v0.26.4-platform-expansion]
    paths: ['.development/v0.26.4/late-platforms-finalize-request.json']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-late-platforms-final, cancel-in-progress: false}
jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize exact late-platform production layers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('.development\v0.26.4\apply_mame_release_resolver.py','.development\v0.26.4\apply_vita3k_architecture_resolver.py','.development\v0.26.4\apply_bigpemu_full_settings.py','.development\v0.26.4\apply_fbneo_native_integration.py','.development\v0.26.4\apply_fbneo_first_run_settings.py','.development\v0.26.4\apply_arcade_enable.py','.development\v0.26.4\apply_modern_playstation_launch_enable.py','.development\v0.26.4\apply_source_manifest.py')){python $script;if($LASTEXITCODE-ne0){throw "Late-platform materializer failed: $script"}}
      - name: Parse all production PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$files=@(Get-ChildItem -LiteralPath . -File -Filter '*.ps1')+@(Get-ChildItem -LiteralPath '.\Tools' -File -Filter '*.ps1' -ErrorAction SilentlyContinue);foreach($file in $files){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$($file.Name): $($_.Message)"};throw "PowerShell parse failed: $($file.Name)"}}
      - name: Live-install PS4 Vita Arcade FBNeo and Jaguar x64 backends
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=[ordered]@{};foreach($id in @('PS4','VITA','ARCADE','NEOGEO','JAGUAR')){$root=Join-Path $env:RUNNER_TEMP ('hc-final-'+$id.ToLower());New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId $id -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$r=$json|ConvertFrom-Json;$exe=[string]$r.Executable;if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw "$id installer did not return an executable"};$bytes=[IO.File]::ReadAllBytes($exe);$pe=[BitConverter]::ToInt32($bytes,0x3c);$machine=[BitConverter]::ToUInt16($bytes,$pe+4);if($machine-ne0x8664){throw "$id installed non-x64 PE machine 0x$($machine.ToString('X4'))"};$installed[$id]=$exe;Write-Host "$id x64 backend: $exe"};$installed|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'hc-late-installed.json') -Encoding UTF8
      - name: Prove MAME and FBNeo runtime contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'hc-late-installed.json') -Encoding UTF8|ConvertFrom-Json
          $mame=[string]$installed.ARCADE;$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$mame;$psi.Arguments='-showconfig';$psi.WorkingDirectory=Split-Path -Parent $mame;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$stdout=$p.StandardOutput.ReadToEnd();$stderr=$p.StandardError.ReadToEnd();if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'MAME -showconfig timed out'};if($stdout-notmatch'(?im)^\s*rompath\s'){throw 'MAME -showconfig did not expose rompath'}
          $fb=[string]$installed.NEOGEO;$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$fb;$psi.Arguments='-listinfo';$psi.WorkingDirectory=Split-Path -Parent $fb;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$outTask=$p.StandardOutput.ReadToEndAsync();$errTask=$p.StandardError.ReadToEndAsync();if(-not$p.WaitForExit(25000)){try{$p.Kill()}catch{};throw 'FBNeo -listinfo timed out'};try{$null=$outTask.Result;$null=$errTask.Result}catch{};$config=Join-Path (Split-Path -Parent $fb) ('config\'+[IO.Path]::GetFileNameWithoutExtension($fb)+'.ini');if(-not(Test-Path -LiteralPath $config -PathType Leaf)){throw "FBNeo -listinfo did not generate $config"};$raw=Get-Content -Raw $config -Encoding UTF8;if($raw-notmatch'(?m)^szAppRomPaths\[0\]\s+'-or$raw-notmatch'(?m)^nVidVSync\s+'){throw 'FBNeo generated config is incomplete'}
      - name: Prove BigPEmu and FBNeo preservation-safe settings edits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$script:BaseDir=(Resolve-Path '.').Path;function Write-Log{};function Get-EntryProperty{param($Object,[string]$Name,$Default=$null);if($null-ne$Object){$p=$Object.PSObject.Properties[$Name];if($p){return $p.Value}};return $Default};. .\HuymaierEmulatorSettings.ps1
          $big=Join-Path $env:RUNNER_TEMP 'BigPEmuConfig.bigpcfg';([ordered]@{VideoPlugin='BigPEmu_Video_OpenGL';FutureUnknownSetting=123;Nested=[ordered]@{HDR=$true;Scale=2}}|ConvertTo-Json -Depth 6)|Set-Content -LiteralPath $big -Encoding UTF8;$bigItems=@(Get-HcEmulatorConfigSettings -AdapterId 'bigpemu' -Path $big);$bigTarget=$bigItems|Where-Object{$_.Key-eq'VideoPlugin'}|Select-Object -First 1;if($null-eq$bigTarget-or[string]$bigTarget.Format-ne'json'){throw 'BigPEmu setting record did not resolve as JSON'};$bigBackup=Join-Path $env:LOCALAPPDATA 'Huymaier Console\EmulatorPlatforms\ConfigBackups\bigpemu';$before=@(Get-ChildItem $bigBackup -File -Recurse -ErrorAction SilentlyContinue).Count;Set-HcEmulatorConfigSetting -Setting $bigTarget -Value 'BigPEmu_Video_D3D12';$after=Get-Content -Raw $big -Encoding UTF8|ConvertFrom-Json;if($after.VideoPlugin-ne'BigPEmu_Video_D3D12'-or$after.FutureUnknownSetting-ne123-or-not$after.Nested.HDR-or$after.Nested.Scale-ne2){throw 'BigPEmu edit destroyed unknown data'};if(@(Get-ChildItem $bigBackup -File -Recurse -ErrorAction SilentlyContinue).Count-le$before){throw 'BigPEmu edit did not create backup'}
          $fb=Join-Path $env:RUNNER_TEMP 'fbneo-preserve.ini';@('// preserved comment','nVidVSync 1','FutureUnknownOption 987','szAppRomPaths[0] X:\ROMs\')|Set-Content -LiteralPath $fb -Encoding UTF8;$fbItems=@(Get-HcEmulatorConfigSettings -AdapterId 'fbneo' -Path $fb);$fbTarget=$fbItems|Where-Object{$_.Key-eq'nVidVSync'}|Select-Object -First 1;if($null-eq$fbTarget-or[string]$fbTarget.Format-ne'key-value'){throw 'FBNeo setting record did not resolve as key-value'};Set-HcEmulatorConfigSetting -Setting $fbTarget -Value '0';$fbAfter=Get-Content -Raw $fb -Encoding UTF8;if($fbAfter-notmatch'(?m)^nVidVSync 0$'-or$fbAfter-notmatch'FutureUnknownOption 987'-or$fbAfter-notmatch'// preserved comment'){throw 'FBNeo edit destroyed unknown/comment data'}
      - name: Validate modern PlayStation and arcade graduation contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installer=Get-Content -Raw 'HuymaierEmulatorInstaller.ps1' -Encoding UTF8;if($installer-match'Get-GithubLatestAssets'){throw 'Undefined GitHub asset helper remains'};foreach($m in @("Get-GithubReleaseAsset 'mamedev/mame'","'windows-latest.zip'")){if($installer-notmatch[regex]::Escape($m)){throw "Installer contract missing $m"}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('EnsureFbNeoRomPath','BuildMameOverrideArguments','-rompath','shad.Append("-g ")','"-r " + QuoteProcessArgument(titleId)','RefreshModernPlayStationLibrary(showNotice)','RenderPs4DynamicMenu','RenderVitaLiveArea','RenderArcadeOperatorSettings','RenderArcadeStorage')){if($native-notmatch[regex]::Escape($m)){throw "Late-platform native marker missing $m"}};if($native-match'LeftShoulder[^\r\n]{0,200}SwitchPage'-or$native-match'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulder buttons switch ordinary pages'}
          $reg=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json;foreach($id in @('arcade','finalburnneo','neogeo','ps4','vita')){$e=@($reg.platforms|Where-Object{$_.id-eq$id});if($e.Count-ne1-or-not[bool]$e[0].enabled){throw "$id was not graduated exactly once"};if(@($e[0].capabilities)-notcontains'native-full-emulator-settings'){throw "$id missing full native settings capability"}}
          $j=Get-Content -Raw 'EmulatorPlatforms\Jaguar\platform.json' -Encoding UTF8|ConvertFrom-Json;if([bool]$j.enabled){throw 'Jaguar graduated before first-run config initialization was proven'}
      - name: Compile exact combined x64 native host source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';if(-not(Test-Path $csc)){throw 'Framework64 csc missing'};$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-v0264-late-final.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'Late-platform exact x64 compile failed'}
      - name: Commit exact validated late-platform production source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorInstaller.ps1 HuymaierEmulatorSettings.ps1 HuymaierEmulatorSettingsWorker.ps1 Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/Arcade/platform.json EmulatorPlatforms/FinalBurnNeo/platform.json EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/PS4/platform.json EmulatorPlatforms/Vita/platform.json EmulatorPlatforms/platform-registry.json manifest.json .source/source-files.txt;if(git diff --cached --quiet){Write-Host 'Late-platform source already matches validated state.';exit 0};git commit -m 'Finalize validated v0.26.4 late platform production source';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Late-platform finalization rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Late-platform finalization push failed'}
