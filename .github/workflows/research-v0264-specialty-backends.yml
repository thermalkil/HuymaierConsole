name: Research v0.26.4 Jaguar and Neo Geo Backend Readiness

on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths:
      - '.development/v0.26.4/specialty-backend-research-request.json'
      - '.github/workflows/research-v0264-specialty-backends.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-specialty-backend-research
  cancel-in-progress: true

jobs:
  research:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0

      - name: Probe current official x64 BigPEmu and FBNeo distributions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$headers=@{'User-Agent'='Huymaier-Console-v0.26.4-readiness-audit'}
          $work=Join-Path $env:RUNNER_TEMP 'hc-specialty-research';Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path $work|Out-Null
          # Deliberately omit a wall-clock timestamp. This research workflow is
          # content-addressed: unchanged upstream releases must not create another
          # bot commit and recursively retrigger the PR.
          $report=[ordered]@{schemaVersion=2;bigpemu=[ordered]@{};fbneo=[ordered]@{}}

          $pageUrl='https://www.richwhitehouse.com/jaguar/index.php?content=download'
          try{
            $page=Invoke-WebRequest -UseBasicParsing -Uri $pageUrl -Headers $headers;$html=[string]$page.Content
            $match=[regex]::Match($html,'(?is)Windows\s*\(x64\).{0,1200}?href=["''](?<url>[^"'']*BigPEmu[^"'']*\.zip)["'']')
            if(-not$match.Success){throw 'The official BigPEmu Windows (x64) link was not found.'}
            $href=[Net.WebUtility]::HtmlDecode($match.Groups['url'].Value);$download=$(if($href-match'^https?://'){$href}else{(New-Object Uri ([uri]$pageUrl),$href).AbsoluteUri});if($download-match'(?i)ARM64'){throw 'BigPEmu x64 research resolved the ARM64 archive.'}
            $report.bigpemu.downloadResolved=$true;$report.bigpemu.downloadUrl=$download;$zip=Join-Path $work 'BigPEmu-x64.zip';Invoke-WebRequest -UseBasicParsing -Uri $download -Headers $headers -OutFile $zip;$report.bigpemu.archiveSha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$extract=Join-Path $work 'BigPEmu';Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $exe=Get-ChildItem $extract -File -Recurse -Filter 'BigPEmu.exe' -ErrorAction SilentlyContinue|Select-Object -First 1;if(-not$exe){throw 'BigPEmu.exe was not found in the official x64 archive.'};$raw=[IO.File]::ReadAllBytes($exe.FullName);$pe=[BitConverter]::ToInt32($raw,0x3c);$machine=[BitConverter]::ToUInt16($raw,$pe+4);$report.bigpemu.executableResolved=$true;$report.bigpemu.peMachine=('0x'+$machine.ToString('X4'));$report.bigpemu.fileVersion=$exe.VersionInfo.FileVersion;$report.bigpemu.productVersion=$exe.VersionInfo.ProductVersion
          }catch{$report.bigpemu.downloadResolved=$false;$report.bigpemu.error=$_.Exception.Message}

          try{
            $release=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/finalburnneo/FBNeo/releases/latest';$report.fbneo.tag=[string]$release.tag_name;$report.fbneo.releaseName=[string]$release.name;$report.fbneo.assets=@($release.assets|ForEach-Object{[ordered]@{name=$_.name;size=$_.size;url=$_.browser_download_url}})
            $asset=@($release.assets|Where-Object{$_.name -ieq 'windows-x86_64.zip'}|Select-Object -First 1);if(-not$asset){$asset=@($release.assets|Where-Object{$_.name-match'(?i)windows.*(x86_64|x64|64).*\.zip$'-and$_.name-notmatch'(?i)debug'}|Select-Object -First 1)};if(-not$asset){throw 'No current official FBNeo Windows x86_64 archive was found.'}
            $report.fbneo.binaryResolved=$true;$report.fbneo.selectedAsset=[string]$asset.name;$archive=Join-Path $work ([string]$asset.name);Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri ([string]$asset.browser_download_url) -OutFile $archive;$report.fbneo.archiveSha256=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant();$dest=Join-Path $work 'FBNeo';Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
            $executables=@(Get-ChildItem $dest -File -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue|ForEach-Object{$_.Name}|Sort-Object -Unique);$report.fbneo.executables=$executables;$exe=Get-ChildItem $dest -File -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue|Where-Object{$_.Name-match'(?i)(fbneo|finalburn)'}|Select-Object -First 1;if($exe){$raw=[IO.File]::ReadAllBytes($exe.FullName);$pe=[BitConverter]::ToInt32($raw,0x3c);$report.fbneo.executableResolved=$true;$report.fbneo.executableName=$exe.Name;$report.fbneo.peMachine=('0x'+([BitConverter]::ToUInt16($raw,$pe+4)).ToString('X4'))}else{$report.fbneo.executableResolved=$false}
          }catch{$report.fbneo.binaryResolved=$false;$report.fbneo.error=$_.Exception.Message}

          $jsonPath='.development\v0.26.4\specialty-backend-research.json';$report|ConvertTo-Json -Depth 9|Set-Content $jsonPath -Encoding UTF8
          $md=New-Object Text.StringBuilder;[void]$md.AppendLine('# v0.26.4 Jaguar / Neo Geo backend readiness');[void]$md.AppendLine();[void]$md.AppendLine('Deterministic audit of the current official Windows x64 distributions.');[void]$md.AppendLine();[void]$md.AppendLine('## BigPEmu');[void]$md.AppendLine("- x64 download resolved: $($report.bigpemu.downloadResolved)");[void]$md.AppendLine("- Executable resolved: $($report.bigpemu.executableResolved)");[void]$md.AppendLine("- PE machine: $($report.bigpemu.peMachine)");[void]$md.AppendLine();[void]$md.AppendLine('## FinalBurn Neo');[void]$md.AppendLine("- Latest tag: $($report.fbneo.tag)");[void]$md.AppendLine("- Windows x86_64 asset: $($report.fbneo.selectedAsset)");[void]$md.AppendLine("- Executable resolved: $($report.fbneo.executableResolved)");[void]$md.AppendLine("- Executable name: $($report.fbneo.executableName)");$md.ToString()|Set-Content '.development\v0.26.4\specialty-backend-research.md' -Encoding UTF8
          $global:LASTEXITCODE=0;exit 0

      - name: Commit only materially changed research
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .development/v0.26.4/specialty-backend-research.json .development/v0.26.4/specialty-backend-research.md;if(git diff --cached --quiet){Write-Host 'Specialty backend research is unchanged.';exit 0};git commit -m 'Record v0.26.4 Jaguar and Neo Geo backend readiness research';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Specialty research rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Specialty research push failed'}
