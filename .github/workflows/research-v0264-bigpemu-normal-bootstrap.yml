name: Research v0.26.4 BigPEmu Normal Config Bootstrap
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/bigpemu-normal-bootstrap-request.json','.github/workflows/research-v0264-bigpemu-normal-bootstrap.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-bigpemu-normal-bootstrap, cancel-in-progress: true}
jobs:
  research:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Launch current official BigPEmu normally and inspect managed cfgpath
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$root=Join-Path $env:RUNNER_TEMP 'hc-bigpemu-normal';New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId JAGUAR -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$r=$json|ConvertFrom-Json;$exe=[string]$r.Executable;if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'BigPEmu install failed'}
          $attempts=New-Object Collections.ArrayList
          foreach($mode in @('cfgpathabs','localdata')){
            $managed=Join-Path $root ($mode+'\BigPEmuConfig.bigpcfg');New-Item -ItemType Directory -Force -Path (Split-Path -Parent $managed)|Out-Null;Remove-Item $managed -Force -ErrorAction SilentlyContinue
            $args=$(if($mode-eq'cfgpathabs'){@('-cfgpathabs',$managed)}else{@('-localdata')})
            $p=Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory (Split-Path -Parent $exe) -PassThru;Start-Sleep -Seconds 8
            if(-not$p.HasExited){try{[void]$p.CloseMainWindow();Start-Sleep -Seconds 3}catch{};if(-not$p.HasExited){try{$p.Kill();$p.WaitForExit()}catch{}}}
            $candidates=@($managed,(Join-Path (Split-Path -Parent $exe) 'UserData\BigPEmuConfig.bigpcfg'),(Join-Path $env:APPDATA 'BigPEmu\BigPEmuConfig.bigpcfg'))|Where-Object{Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -Unique
            foreach($candidate in @($candidates)){$raw=Get-Content -Raw $candidate -Encoding UTF8;$jsonValid=$false;try{$obj=$raw|ConvertFrom-Json;$jsonValid=$true}catch{};[void]$attempts.Add([ordered]@{mode=$mode;path=$candidate;bytes=(Get-Item $candidate).Length;jsonValid=$jsonValid;topLevelProperties=$(if($jsonValid){@($obj.PSObject.Properties).Count}else{0});sample=$raw.Substring(0,[Math]::Min(700,$raw.Length))})}
          }
          $result=[ordered]@{schemaVersion=1;attempts=$attempts;completeConfigFound=@($attempts|Where-Object{$_.jsonValid-and$_.topLevelProperties-gt10}).Count-gt0};$result|ConvertTo-Json -Depth 7|Set-Content '.development\v0.26.4\bigpemu-normal-bootstrap-research.json' -Encoding UTF8
      - name: Commit stable research result
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .development/v0.26.4/bigpemu-normal-bootstrap-research.json;if(git diff --cached --quiet){exit 0};git commit -m 'Record BigPEmu normal first-run configuration behavior';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'BigPEmu normal research rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'BigPEmu normal research push failed'}
