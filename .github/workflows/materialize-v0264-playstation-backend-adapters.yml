name: Materialize v0.26.4 PlayStation Backend Settings Adapters
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/playstation-adapters-request.json','.development/v0.26.4/apply_playstation_backend_adapters.py','.github/workflows/materialize-v0264-playstation-backend-adapters.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-playstation-adapters, cancel-in-progress: false}
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize backend discovery adapters
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .development\v0.26.4\apply_playstation_backend_adapters.py;if($LASTEXITCODE){throw 'PlayStation adapter materializer failed'}
      - name: Validate adapters and Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierEmulatorSettingsWorker.ps1'),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host $_.Message};throw 'Emulator settings worker parse failed.'}
          foreach($pair in @(@('PS1','duckstation','DuckStation'),@('PS2','pcsx2','PCSX2'),@('PS3','rpcs3','RPCS3'))){$d=Get-Content -Raw (Join-Path (Join-Path 'EmulatorPlatforms' $pair[0]) 'platform.json') -Encoding UTF8|ConvertFrom-Json;if([string]$d.adapter-ne$pair[1]-or[string]$d.primaryBackend-ne$pair[2]-or-not[bool]$d.nativeFullEmulatorSettings){throw "$($pair[0]) full-settings adapter definition invalid."}}
          $w=Get-Content -Raw 'HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;foreach($m in @("'duckstation'","'pcsx2'","'rpcs3'",'gamesettings','inputprofiles','custom_configs','PCSX2.ini','config.yml')){if($w -notmatch [regex]::Escape($m)){throw "PlayStation settings discovery marker missing: $m"}}
      - name: Prove presentation sources are unchanged
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git diff --quiet HEAD -- Native/HuymaierConsole.Ps1.cs Native/HuymaierConsole.NativeApp.cs;if($LASTEXITCODE-ne0){throw 'PlayStation presentation source changed in backend-adapter materializer.'}
      - name: Commit validated adapters
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorSettingsWorker.ps1 EmulatorPlatforms/PS1/platform.json EmulatorPlatforms/PS2/platform.json EmulatorPlatforms/PS3/platform.json;if(git diff --cached --quiet){exit 0};git commit -m 'Materialize v0.26.4 PlayStation full-settings backend adapters';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'PlayStation adapter rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'PlayStation adapter push failed'}
