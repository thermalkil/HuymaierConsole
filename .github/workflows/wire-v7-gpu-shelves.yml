name: Wire V7 GPU shelf runtime

on:
  push:
    paths:
      - '.github/workflows/wire-v7-gpu-shelves.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Wire current V7 source and self-clean
        shell: python
        run: |
          from pathlib import Path

          p=Path('HuymaierGpuPlatformShelves.ps1')
          text=p.read_text(encoding='utf-8-sig')
          anchor="$script:HcGpuShelfNativeDll=Join-Path $script:BaseDir 'HuymaierD3D11ShelfRenderer.dll'"
          if "$script:HcGpuShelfHostDll" not in text:
              if anchor not in text: raise SystemExit('V7 native path anchor missing')
              text=text.replace(anchor,anchor+"\n$script:HcGpuShelfHostDll=Join-Path $script:BaseDir 'HuymaierGpuShelfHost.dll'",1)
          old="""        if(-not(Test-Path -LiteralPath $script:HcGpuShelfCompilerExe -PathType Leaf)){throw 'HuymaierGpuShelfAssetCompiler.exe is missing.'}\n        New-Item -ItemType Directory -Force -Path $script:HcGpuShelfCacheDir|Out-Null\n        if(($env:PATH -split ';') -notcontains $script:BaseDir){$env:PATH=$script:BaseDir+';'+$env:PATH}\n        if(-not(Initialize-HcLiveModelAssembly)){throw 'HuymaierLiveModel3D.dll could not be loaded.'}\n        $type=[type]::GetType('HuymaierConsole.Modeling.D3D11ShelfSurface, HuymaierLiveModel3D',$false)\n        if($null-eq$type){\n            try{$type=[HuymaierConsole.Modeling.D3D11ShelfSurface]}catch{}\n        }\n        if($null-eq$type){throw 'D3D11ShelfSurface type is unavailable.'}"""
          new="""        if(-not(Test-Path -LiteralPath $script:HcGpuShelfCompilerExe -PathType Leaf)){throw 'HuymaierGpuShelfAssetCompiler.exe is missing.'}\n        if(-not(Test-Path -LiteralPath $script:HcGpuShelfHostDll -PathType Leaf)){throw 'HuymaierGpuShelfHost.dll is missing.'}\n        New-Item -ItemType Directory -Force -Path $script:HcGpuShelfCacheDir|Out-Null\n        if(($env:PATH -split ';') -notcontains $script:BaseDir){$env:PATH=$script:BaseDir+';'+$env:PATH}\n        $gpuType=[type]::GetType('HuymaierConsole.Modeling.D3D11ShelfSurface, HuymaierGpuShelfHost',$false)\n        if($null-eq$gpuType){\n            Add-Type -Path $script:HcGpuShelfHostDll -ErrorAction Stop\n            $gpuType=[type]::GetType('HuymaierConsole.Modeling.D3D11ShelfSurface, HuymaierGpuShelfHost',$false)\n        }\n        if($null-eq$gpuType){throw 'D3D11ShelfSurface type is unavailable.'}"""
          if old not in text: raise SystemExit('V7 host-load anchor missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('.source/source-files.txt')
          lines=p.read_text(encoding='utf-8-sig').splitlines()
          additions=['HuymaierGpuPlatformShelves.ps1','Native/HuymaierD3D11ShelfRenderer.cpp','Native/HuymaierD3D11ShelfRuntime.cpp','Native/HuymaierD3D11ShelfAsset.h','Native/HuymaierD3D11ShelfAsset.cpp','Native/HuymaierD3D11ShelfHost.cs','Native/HuymaierGpuShelfAssetCompiler.cs','Native/HuymaierGpuShelfAssetCompilerProgram.cs']
          for item in additions:
              if item in lines: continue
              if item.startswith('HuymaierGpu'):
                  idx=lines.index('HuymaierUser3DModels.ps1')+1
              else:
                  idx=lines.index('Native/HuymaierGameInputBridge.cpp')+1
              lines.insert(idx,item)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          p=Path('.build/Optimize-Platform3DModels.ps1')
          text=p.read_text(encoding='utf-8-sig')
          marker='# HUYMAIER_D3D11_GPU_SHELF_BUILD_TRANSFORM_V1'
          if marker not in text:
              text=text.rstrip()+"\n\n"+marker+"\n$gpuShelfBuildTransform=Join-Path $PSScriptRoot 'Optimize-GpuPlatformShelves.ps1'\nif(-not(Test-Path -LiteralPath $gpuShelfBuildTransform -PathType Leaf)){throw \"GPU shelf build transform missing: $gpuShelfBuildTransform\"}\n& $gpuShelfBuildTransform -CoreBuilderPath $CoreBuilderPath\n"
          p.write_text(text,encoding='utf-8')

          p=Path('.build/Optimize-User3DModels.ps1')
          text=p.read_text(encoding='utf-8-sig')
          if "'HuymaierGpuShelfHost.dll'" not in text:
              needle="            'HuymaierD3D11ShelfRenderer.dll',"
              if needle not in text: raise SystemExit('GPU installer native DLL anchor missing')
              text=text.replace(needle,needle+"\n            'HuymaierGpuShelfHost.dll',",1)
          p.write_text(text,encoding='utf-8')

          Path('.github/workflows/wire-v7-gpu-shelves.yml').unlink()
      - name: Commit V7 wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Wire V7 GPU shelves into release build and runtime load order'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
