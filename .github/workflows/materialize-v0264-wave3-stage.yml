name: Stage Huymaier Console v0.26.4 Wave 3 Specialty Platforms

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave3-stage-request.json'
      - '.development/v0.26.4/apply_wave3_stage.py'
      - '.github/workflows/materialize-v0264-wave3-stage.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-wave3-stage
  cancel-in-progress: false

jobs:
  stage-and-compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize Wave 3 specialty interfaces
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if(-not(Test-Path 'EmulatorPlatforms\AtariLynx\platform.json') -or $native -notmatch [regex]::Escape('private bool IsWave3Shell()')){
            python .development\v0.26.4\apply_wave3_stage.py
            if($LASTEXITCODE -ne 0){throw 'Wave 3 staging materializer failed.'}
          }else{Write-Host 'Wave 3 specialty staging already materialized.'}
      - name: Validate Wave 3 definitions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($folder in @('AtariLynx','NeoGeo','NGPC','Jaguar','PrimeHack')){$p=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'platform.json';$s=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'settings.default.json';if(-not(Test-Path $p) -or -not(Test-Path $s)){throw "Wave 3 package missing: $folder"};$d=Get-Content -Raw $p -Encoding UTF8|ConvertFrom-Json;if([bool]$d.enabled){throw "$folder must remain disabled during staging."}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          foreach($marker in @('RenderAtariLynxHandheld','RenderNeoGeoDeck','RenderNgpcHandheld','RenderJaguarDeck','RenderPrimeHackVisor')){if($native -notmatch [regex]::Escape($marker)){throw "Wave 3 native surface missing: $marker"}}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave3.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave 3 specialty x64 compile failed.'}
      - name: Commit validated Wave 3 staging
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/AtariLynx EmulatorPlatforms/NeoGeo EmulatorPlatforms/NGPC EmulatorPlatforms/Jaguar EmulatorPlatforms/PrimeHack;if(git diff --cached --quiet){Write-Host 'No Wave 3 staging changes.';exit 0};git commit -m 'Stage v0.26.4 Wave 3 specialty native platform surfaces';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 3 staging rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 3 staging push failed.'}
