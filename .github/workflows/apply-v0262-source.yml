name: Apply v0.26.2 Source Batch

on:
  push:
    branches:
      - feature/v0.26.2-customization-runtime
    paths:
      - '.development/v0.26.2/source-apply.json'
      - '.github/workflows/apply-v0262-source.yml'

permissions:
  contents: write

concurrency:
  group: v0262-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.26.2-customization-runtime
          fetch-depth: 0

      - name: Apply requested transformer
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='.development/v0.26.2/source-apply.json'
          STATUS='.development/v0.26.2/source-status.json'
          BATCH="$(python3 -c "import json;print(json.load(open('$REQUEST'))['batch'])")"
          SCRIPT="$(python3 -c "import json;print(json.load(open('$REQUEST'))['script'])")"
          LAST=''
          if [ -f "$STATUS" ]; then LAST="$(python3 -c "import json;print(json.load(open('$STATUS')).get('batch',''))")"; fi
          if [ "$LAST" = "$BATCH" ]; then echo "Batch $BATCH already applied."; exit 0; fi
          test -f ".development/v0.26.2/$SCRIPT"
          python3 ".development/v0.26.2/$SCRIPT"
          python3 - <<PY
          import json,datetime
          open('$STATUS','w',encoding='utf-8').write(json.dumps({'batch':'$BATCH','script':'$SCRIPT','result':'success','recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No source changes.'; exit 0; fi
          git commit -m "Apply v0.26.2 source batch $BATCH"
          git push origin HEAD:feature/v0.26.2-customization-runtime
