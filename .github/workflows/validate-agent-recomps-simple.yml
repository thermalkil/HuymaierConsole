name: Validate Simple Recomps Library

on:
  push:
    branches:
      - agent/v0265-recomps-simple-library

permissions:
  contents: read

concurrency:
  group: huymaier-recomps-simple-library
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manual Recomps routing
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Test-v0265-PowerShellSafety.ps1'
          & '.\.development\v0.26.5\Test-v0265-ManualRecomps.ps1'
          & '.\.development\v0.26.5\Test-v0265-RecompsDirectLibrary.ps1'
