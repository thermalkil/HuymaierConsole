name: Validate v0.26.5 UV Aliases Recomps

on:
  push:
    branches:
      - agent/v0265-uv-alias-recomps

permissions:
  contents: write

concurrency:
  group: huymaier-v0265-uv-alias-recomps
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recheck materialized source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Apply-v0265-UvAliasesRecompsV4.ps1'
          & '.\.development\v0.26.5\Test-v0265-PowerShellSafety.ps1'

      - name: Recheck GPU models and canonical providers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Prepare-v0265-PlatformModelValidation.ps1'
          & '.\.development\v0.26.5\Test-v0265-PlatformModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-User3DModels.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11ShelfBackend.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuShelfAssetCompiler.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11CachedModelRender.ps1'
          & '.\.development\v0.26.5\Test-v0265-D3D11UvAddressing.ps1'
          & '.\.development\v0.26.5\Test-v0265-GpuPlatformShelvesV7.ps1'
          & '.\.development\v0.26.5\Test-v0265-CanonicalRecomps.ps1'

      - name: Materialize normal-workflow validation source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Finalize-v0265-AgentNormalWorkflowValidation.ps1'
          git config user.name 'huymaier-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- `
            '.github/workflows/validate-v0265-platform-models.yml' `
            '.github/workflows/validate-v0265-unified-cursor.yml' `
            '.github/workflows/validate-v0265-performance.yml' `
            '.github/workflows/validate-v0265-download-refresh.yml' `
            '.github/workflows/validate-v0265-gamecube.yml' `
            '.github/workflows/validate-agent-v0265-uv-alias-recomps.yml' `
            '.development/v0.26.5/Apply-v0265-UvAliasesRecomps.ps1' `
            '.development/v0.26.5/Apply-v0265-UvAliasesRecompsV2.ps1' `
            '.development/v0.26.5/Apply-v0265-UvAliasesRecompsV3.ps1' `
            '.development/v0.26.5/Apply-v0265-UvAliasesRecompsV4.ps1' `
            '.development/v0.26.5/Finalize-v0265-AgentNormalWorkflowValidation.ps1'
          if(git diff --cached --quiet){throw 'Expected normal-workflow/final cleanup delta was empty.'}
          git commit -m 'Prepare exact v0.26.5 five-workflow validation source'
          git push origin HEAD:agent/v0265-uv-alias-recomps
