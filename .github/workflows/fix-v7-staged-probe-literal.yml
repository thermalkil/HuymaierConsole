name: Fix staged V7 probe negative float literal
on:
  push:
    paths: ['.github/workflows/fix-v7-staged-probe-literal.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.5-performance-and-downloads, fetch-depth: 0}
      - name: Correct strict-mode literal and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.build/Test-HuymaierV0265PlatformModelsCandidate.ps1')
          text=p.read_text(encoding='utf-8-sig')
          old='$bw.Write([single]-1)'
          new='$bw.Write([single](-1))'
          if old not in text:
              raise SystemExit('Staged V7 negative-float probe literal not found')
          text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/fix-v7-staged-probe-literal.yml').unlink()
      - name: Commit staged probe correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name thermalkil
          git config user.email 98826286+thermalkil@users.noreply.github.com
          git add -A
          git commit -m 'Fix strict-mode staged V7 GPU probe literal'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
