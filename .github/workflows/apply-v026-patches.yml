name: Apply Huymaier Console Development Batch

on:
  push:
    branches:
      - feature/v0.26.0-native-gamebar
      - hotfix/v0.26.1-installer
      - feature/v0.26.2-customization-runtime
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.0/apply.json'
      - '.development/v0.26.1/apply.json'
      - '.development/v0.26.2/apply.json'
      - '.development/v0.26.3/apply.json'
      - '.github/workflows/apply-v026-patches.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-development-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-development:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve development directory
        id: dev
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            hotfix/v0.26.1-installer)
              DIR='.development/v0.26.1'
              ;;
            feature/v0.26.2-customization-runtime)
              DIR='.development/v0.26.2'
              ;;
            feature/v0.26.3-console-fidelity)
              DIR='.development/v0.26.3'
              ;;
            *)
              DIR='.development/v0.26.0'
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Apply deterministic development batch
        shell: bash
        env:
          DEV_DIR: ${{ steps.dev.outputs.dir }}
        run: |
          set -euo pipefail
          APPLY="$DEV_DIR/apply.json"
          STATUS="$DEV_DIR/status.json"
          BATCH="$(python3 -c "import json;print(json.load(open('$APPLY'))['batch'])")"
          SCRIPT="$(python3 -c "import json;print(json.load(open('$APPLY')).get('script',''))")"
          PATCH_DIR="$(python3 -c "import json;print(json.load(open('$APPLY')).get('patch_dir',''))")"
          LAST=''
          if [ -f "$STATUS" ]; then
            LAST="$(python3 -c "import json;print(json.load(open('$STATUS')).get('batch',''))")"
          fi
          if [ "$LAST" = "$BATCH" ]; then
            echo "Development batch $BATCH is already applied."
            exit 0
          fi

          if [ -n "$SCRIPT" ]; then
            TRANSFORMER="$DEV_DIR/$SCRIPT"
            test -f "$TRANSFORMER"
            python3 "$TRANSFORMER"
          elif [ -n "$PATCH_DIR" ]; then
            shopt -s nullglob
            patches=("$PATCH_DIR"/*.patch)
            if [ "${#patches[@]}" -eq 0 ]; then
              echo "No patch files found in $PATCH_DIR"
              exit 1
            fi
            for patch in "${patches[@]}"; do git apply --check --whitespace=nowarn "$patch"; done
            for patch in "${patches[@]}"; do git apply --whitespace=nowarn "$patch"; done
          else
            echo 'apply.json requires either script or patch_dir.'
            exit 1
          fi

          python3 - <<PY
          import json,datetime,os
          state={
            'batch':'$BATCH',
            'script':'$SCRIPT',
            'patch_dir':'$PATCH_DIR',
            'result':'success',
            'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('$STATUS','w',encoding='utf-8').write(json.dumps(state,indent=2)+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "Apply $GITHUB_REF_NAME development batch $BATCH"
          git push origin HEAD:$GITHUB_REF_NAME
