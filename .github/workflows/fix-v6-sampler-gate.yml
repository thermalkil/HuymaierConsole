name: Fix V6 sampler validation symbol

on:
  push:
    paths:
      - '.github/workflows/fix-v6-sampler-gate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Align sampler validation with implementation and self-clean
        shell: python
        run: |
          from pathlib import Path
          targets = [
              Path('.development/v0.26.5/Test-v0265-User3DModels.ps1'),
              Path('.development/v0.26.5/Test-v0265-Live3DCardRender.ps1'),
          ]
          for p in targets:
              text = p.read_text(encoding='utf-8-sig')
              if "'WrapMode'" not in text:
                  raise SystemExit(f'{p}: stale WrapMode assertion was not found')
              p.write_text(text.replace("'WrapMode'", "'WrapCoordinate'"), encoding='utf-8')
          Path('.github/workflows/fix-v6-sampler-gate.yml').unlink()
      - name: Commit sampler gate correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Align V6 sampler validation with WrapCoordinate implementation'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
