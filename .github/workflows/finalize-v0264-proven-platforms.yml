name: Finalize Huymaier Console v0.26.4 Proven Platforms
on:
  push:
    branches: [feature/v0.26.4-platform-expansion]
    paths: ['.development/v0.26.4/proven-platforms-finalize-request.json']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-proven-final, cancel-in-progress: false}
jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize only proven late platforms and v0.26.4 identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('.development\v0.26.4\apply_mame_release_resolver.py','.development\v0.26.4\apply_vita3k_architecture_resolver.py','.development\v0.26.4\apply_modern_playstation_launch_enable.py','.development\v0.26.4\apply_proven_late_platforms.py','.development\v0.26.4\apply_version_bump.py','.development\v0.26.4\apply_source_manifest.py')){python $script;if($LASTEXITCODE-ne0){throw "Materializer failed: $script"}}
      - name: Parse all production PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$files=@(Get-ChildItem . -File -Filter '*.ps1')+@(Get-ChildItem '.\Tools' -File -Filter '*.ps1' -ErrorAction SilentlyContinue);foreach($file in $files){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$($file.Name): $($_.Message)"};throw "PowerShell parse failed: $($file.Name)"}}
      - name: Live-install current PS4 Vita and MAME x64 backends
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=[ordered]@{};foreach($id in @('PS4','VITA','ARCADE')){$root=Join-Path $env:RUNNER_TEMP ('hc-proven-'+$id.ToLower());New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId $id -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$r=$json|ConvertFrom-Json;$exe=[string]$r.Executable;if(-not(Test-Path $exe -PathType Leaf)){throw "$id installer returned no executable"};$b=[IO.File]::ReadAllBytes($exe);$pe=[BitConverter]::ToInt32($b,0x3c);$machine=[BitConverter]::ToUInt16($b,$pe+4);if($machine-ne0x8664){throw "$id is not x64: 0x$($machine.ToString('X4'))"};$installed[$id]=$exe;Write-Host "$id => $exe"};$installed|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'proven-installed.json') -Encoding UTF8
      - name: Prove current MAME complete runtime settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'proven-installed.json')|ConvertFrom-Json;$exe=[string]$installed.ARCADE;$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$exe;$psi.Arguments='-showconfig';$psi.WorkingDirectory=Split-Path -Parent $exe;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$stdout=$p.StandardOutput.ReadToEnd();$stderr=$p.StandardError.ReadToEnd();if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'MAME -showconfig timed out'};foreach($key in @('rompath','video','sound','joystick')){if($stdout-notmatch("(?im)^\s*"+[regex]::Escape($key)+"\s")){throw "MAME -showconfig missing $key"}}
      - name: Validate enabled/staged contracts and full-settings coverage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$reg=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json;foreach($id in @('ps4','vita','arcade')){$e=@($reg.platforms|Where-Object{$_.id-eq$id});if($e.Count-ne1-or-not[bool]$e[0].enabled){throw "$id not enabled exactly once"};foreach($cap in @('latest-emulator-install','native-full-emulator-settings','native-save-management')){if(@($e[0].capabilities)-notcontains$cap){throw "$id missing $cap"}}};foreach($id in @('finalburnneo','neogeo','jaguar')){$e=@($reg.platforms|Where-Object{$_.id-eq$id});if($e.Count-ne1){throw "$id registry entry missing/duplicated"};if([bool]$e[0].enabled){throw "$id must remain staged in this candidate"}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('BuildMameOverrideArguments','-rompath','shad.Append("-g ")','"-r " + QuoteProcessArgument(titleId)','RefreshModernPlayStationLibrary(showNotice)','RenderPs4DynamicMenu','RenderVitaLiveArea','RenderArcadeOperatorSettings','RenderArcadeStorage')){if($native-notmatch[regex]::Escape($m)){throw "Native contract missing: $m"}};if($native-match'LeftShoulder[^\r\n]{0,200}SwitchPage'-or$native-match'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulder buttons switch ordinary pages'}
          python .development\v0.26.4\audit_emulator_settings_coverage.py;if($LASTEXITCODE-ne0){throw 'Settings coverage audit failed'};$coverage=Get-Content -Raw '.development\v0.26.4\emulator-settings-coverage.json' -Encoding UTF8|ConvertFrom-Json;if(@($coverage.enabledMissingNativeSettings).Count-ne0){throw ('Enabled platforms missing native full settings: '+(@($coverage.enabledMissingNativeSettings)-join', '))}
      - name: Validate exact v0.26.4 version invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$m=Get-Content -Raw manifest.json -Encoding UTF8|ConvertFrom-Json;if([string]$m.version-ne'0.26.4'-or[string]$m.build-ne'platform-expansion-rc1'){throw 'manifest v0.26.4 RC1 identity invalid'};$core=Get-Content -Raw HuymaierConsole.ps1 -Encoding UTF8;if($core-notmatch[regex]::Escape("`$script:AppVersion = '0.26.4'")){throw 'Core version invariant failed'};$boot=Get-Content -Raw HuymaierBootstrap.ps1 -Encoding UTF8;if($boot-notmatch[regex]::Escape("`$script:ExpectedConsoleVersion='0.26.4'")){throw 'Bootstrap version invariant failed'};$install=Get-Content -Raw HuymaierInstallerCore.ps1 -Encoding UTF8;if($install-notmatch[regex]::Escape("`$script:InstallVersion='0.26.4'")){throw 'Installer version invariant failed'};$appx=Get-Content -Raw FSEPackage\AppxManifest.xml -Encoding UTF8;if($appx-notmatch'Version="0\.26\.4\.0"'){throw 'AppX version invariant failed'}
      - name: Compile exact combined x64 native host source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$src=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-v0264-proven.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$src;& $csc @args;if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'Exact combined x64 compile failed'}
      - name: Commit exact validated v0.26.4 RC1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorInstaller.ps1 Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/Arcade/platform.json EmulatorPlatforms/PS4/platform.json EmulatorPlatforms/Vita/platform.json EmulatorPlatforms/FinalBurnNeo/platform.json EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/Jaguar/platform.json EmulatorPlatforms/platform-registry.json HuymaierConsole.ps1 HuymaierBootstrap.ps1 HuymaierInstallerCore.ps1 Native/HuymaierConsole.GameInput.cs Native/HuymaierConsole.NativeApp.cs FSEPackage/AppxManifest.xml manifest.json README.md .source/source-files.txt .development/v0.26.4/emulator-settings-coverage.json Docs/EMULATOR-SETTINGS-COVERAGE-v0.26.4.md;if(git diff --cached --quiet){Write-Host 'Validated source already materialized';exit 0};git commit -m 'Finalize validated Huymaier Console v0.26.4 RC1 source';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Final source rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Final source push failed'}
