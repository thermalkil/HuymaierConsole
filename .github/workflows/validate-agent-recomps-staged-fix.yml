name: Validate Staged Recomps Candidate Gate

on:
  push:
    branches:
      - agent/v0265-recomps-staged-fix

permissions:
  contents: read

concurrency:
  group: huymaier-recomps-staged-fix
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse staged gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\.build\Test-HuymaierV0265ManualRecompsCandidate.ps1'),[ref]$t,[ref]$e)
          if(@($e).Count){throw "Staged Recomps gate failed PowerShell 5.1 parse: $(@($e|ForEach-Object{$_.Message}) -join '; ')"}

      - name: Build release-transformed Recomps mini-stage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Prepare-v0265-PlatformModelValidation.ps1'
          $stage=Join-Path $env:RUNNER_TEMP 'hc-recomps-stage'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          foreach($rel in @(
            'HuymaierConsole.ps1','HuymaierBootstrap.ps1','Install-HuymaierConsole.ps1','HuymaierCustomization.ps1',
            'HuymaierRecompsManual.ps1','HuymaierRecompsFinal.ps1'
          )){Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $rel) -Destination (Join-Path $stage $rel) -Force}
          $builder=Join-Path $stage 'Build-HuymaierReleaseCandidate.Core.ps1'
          Copy-Item -LiteralPath '.\.build\Build-HuymaierReleaseCandidate.Core.ps1' -Destination $builder -Force
          & '.\.build\Optimize-Platform3DModels.ps1' -CorePath (Join-Path $stage 'HuymaierConsole.ps1') -BootstrapPath (Join-Path $stage 'HuymaierBootstrap.ps1') -InstallerScriptPath (Join-Path $stage 'Install-HuymaierConsole.ps1') -CoreBuilderPath $builder
          & '.\.build\Optimize-User3DModels.ps1' -CorePath (Join-Path $stage 'HuymaierConsole.ps1') -BootstrapPath (Join-Path $stage 'HuymaierBootstrap.ps1') -InstallerScriptPath (Join-Path $stage 'Install-HuymaierConsole.ps1')
          $validation=Join-Path $stage 'candidate-validation.json'
          [pscustomobject]@{version='0.26.5';sha256='probe'}|ConvertTo-Json|Set-Content -LiteralPath $validation -Encoding UTF8
          "HC_RECOMPS_STAGE=$stage"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HC_RECOMPS_VALIDATION=$validation"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute exact staged candidate gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.build\Test-HuymaierV0265ManualRecompsCandidate.ps1' -StageRoot $env:HC_RECOMPS_STAGE -ValidationPath $env:HC_RECOMPS_VALIDATION
