name: Stage Huymaier Console v0.26.4 Wave 2 Hardware Consoles

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave2-stage-request.json'
      - '.development/v0.26.4/apply_wave2_stage.py'
      - '.development/v0.26.4/apply_wave2_compile_fixes.py'
      - '.github/workflows/materialize-v0264-wave2-stage.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-wave2-stage
  cancel-in-progress: false

jobs:
  stage-and-compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize Wave 2 hardware shells
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if(-not(Test-Path 'EmulatorPlatforms\NES\platform.json') -or $native -notmatch [regex]::Escape('private bool IsWave2Shell()')){
            python .development\v0.26.4\apply_wave2_stage.py
            if($LASTEXITCODE -ne 0){throw 'Wave 2 staging materializer failed.'}
          }else{Write-Host 'Wave 2 staging already materialized.'}
          python .development\v0.26.4\apply_wave2_compile_fixes.py
          if($LASTEXITCODE -ne 0){throw 'Wave 2 compile correction overlay failed.'}
      - name: Validate Wave 2 definitions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $folders=@('Atari2600','NES','SNES','GameBoy','GBC','GBA','Genesis','SegaCD','Sega32X','GameGear','MasterSystem','TurboGrafx16')
          foreach($folder in $folders){$p=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'platform.json';$s=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'settings.default.json';if(-not(Test-Path $p) -or -not(Test-Path $s)){throw "Wave 2 platform package missing: $folder"};$d=Get-Content -Raw $p -Encoding UTF8|ConvertFrom-Json;if([bool]$d.enabled){throw "$folder must remain disabled during staging."};if([string]::IsNullOrWhiteSpace([string]$d.primaryBackend) -or [string]::IsNullOrWhiteSpace([string]$d.adapter)){throw "$folder backend/adapter metadata is incomplete."}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          foreach($marker in @('RenderAtari2600Deck','RenderNesDeck','RenderSnesDeck','RenderGameBoyHandheld','RenderGbaHandheld','RenderGenesisDeck','RenderSegaCdDeck','RenderGameGearHandheld','RenderMasterSystemDeck','RenderTurboGrafxDeck')){if($native -notmatch [regex]::Escape($marker)){throw "Wave 2 native shell missing: $marker"}}
          if($native -match [regex]::Escape('WrapPanel cards=new WrapPanel;')){throw 'Wave 2 still contains invalid WrapPanel constructor syntax.'}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave2.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave 2 native shell compile failed.'}
      - name: Commit validated Wave 2 staging
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/Atari2600 EmulatorPlatforms/NES EmulatorPlatforms/SNES EmulatorPlatforms/GameBoy EmulatorPlatforms/GBC EmulatorPlatforms/GBA EmulatorPlatforms/Genesis EmulatorPlatforms/SegaCD EmulatorPlatforms/Sega32X EmulatorPlatforms/GameGear EmulatorPlatforms/MasterSystem EmulatorPlatforms/TurboGrafx16;if(git diff --cached --quiet){Write-Host 'No Wave 2 staging source to commit.';exit 0};git commit -m 'Stage v0.26.4 Wave 2 native hardware console surfaces';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 2 staging rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 2 staging push failed.'}
