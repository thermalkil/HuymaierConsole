name: Materialize v0.26.4 PlayStation Native Full Settings UI
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/playstation-full-settings-ui-request.json','.development/v0.26.4/apply_playstation_full_settings_ui.py','.development/v0.26.4/apply_playstation_full_settings_ui_compile_fix.py','.github/workflows/materialize-v0264-playstation-full-settings-ui.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-playstation-full-settings-ui, cancel-in-progress: false}
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Preserve pre-materialization PS1 presentation source
        shell: powershell
        run: Copy-Item -LiteralPath '.\Native\HuymaierConsole.Ps1.cs' -Destination (Join-Path $env:RUNNER_TEMP 'ps1-before.cs') -Force
      - name: Materialize controller-native complete backend settings UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw '.\Native\HuymaierConsole.NativeApp.cs' -Encoding UTF8;if($native -notmatch [regex]::Escape('COMPLETE_BACKEND_SETTINGS_WINDOW_BEGIN')){python .development\v0.26.4\apply_playstation_full_settings_ui.py;if($LASTEXITCODE){throw 'PlayStation full-settings UI materializer failed'}};python .development\v0.26.4\apply_playstation_full_settings_ui_compile_fix.py;if($LASTEXITCODE){throw 'PlayStation full-settings compile overlay failed'}
      - name: Prove only marked PS1 functional integration was added
        shell: python
        run: |
          from pathlib import Path
          import os,re
          before=Path(os.environ['RUNNER_TEMP'])/'ps1-before.cs'
          current=Path('Native/HuymaierConsole.Ps1.cs')
          a=before.read_text(encoding='utf-8-sig').replace('\r\n','\n')
          b=current.read_text(encoding='utf-8-sig').replace('\r\n','\n')
          for name in ('ACTION','METHOD'):
              b=re.sub(r'(?ms)^\s*// v0\.26\.4 PS1_FULL_BACKEND_SETTINGS_'+name+r'_BEGIN\n.*?^\s*// v0\.26\.4 PS1_FULL_BACKEND_SETTINGS_'+name+r'_END\n?', '', b)
          if a!=b:
              raise SystemExit('PS1 source changed outside the two explicitly marked full-backend-settings integration blocks.')
          print('PS1 visual/navigation source is unchanged outside functional full-settings integration markers')
      - name: Validate native UI contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw '.\Native\HuymaierConsole.NativeApp.cs' -Encoding UTF8;$ps1=Get-Content -Raw '.\Native\HuymaierConsole.Ps1.cs' -Encoding UTF8
          foreach($m in @('NativeBackendSettingsWindow','NativeBackendValueKeyboardWindow','RunWorker("Inventory"','RunWorker("Set"','NativeConsoleNavigation.Poll()','All RPCS3 Settings','Full PCSX2 Settings','OpenFullPcsx2Settings','OpenFullRpcs3Settings','System.Windows.Controls.Primitives.UniformGrid')){if($native -notmatch [regex]::Escape($m)){throw "PlayStation full-settings UI marker missing: $m"}}
          foreach($m in @('Full DuckStation Settings','OpenFullDuckStationSettings','PS1_FULL_BACKEND_SETTINGS_ACTION_BEGIN','PS1_FULL_BACKEND_SETTINGS_METHOD_BEGIN')){if($ps1 -notmatch [regex]::Escape($m)){throw "PS1 full-settings marker missing: $m"}}
          if($native -match 'LeftShoulder[^\r\n]{0,200}(SwitchPage|Move\(|Confirm\()' -or $native -match 'RightShoulder[^\r\n]{0,200}(SwitchPage|Move\(|Confirm\()'){throw 'Full-settings UI assigns shoulder buttons to ordinary navigation.'}
      - name: Compile exact x64 native host source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';if(-not(Test-Path $csc)){throw 'Framework64 csc.exe missing.'};$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-playstation-full-settings.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'PlayStation full-settings x64 compile failed'}
      - name: Commit validated functional UI integration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.NativeApp.cs Native/HuymaierConsole.Ps1.cs;if(git diff --cached --quiet){exit 0};git commit -m 'Materialize v0.26.4 native full settings UI for PS1 PS2 PS3';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'PlayStation full-settings UI rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'PlayStation full-settings UI push failed'}
