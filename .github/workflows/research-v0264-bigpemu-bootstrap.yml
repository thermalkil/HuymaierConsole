name: Research v0.26.4 BigPEmu Config Bootstrap
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/bigpemu-bootstrap-request.json','.github/workflows/research-v0264-bigpemu-bootstrap.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-bigpemu-bootstrap, cancel-in-progress: true}
jobs:
  research:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Download current official BigPEmu x64 and probe documented config setters
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$pageUrl='https://www.richwhitehouse.com/jaguar/index.php?content=download';$headers=@{'User-Agent'='Huymaier-Console-v0.26.4-bootstrap-audit'};$html=[string](Invoke-WebRequest -UseBasicParsing -Uri $pageUrl -Headers $headers).Content;$m=[regex]::Match($html,'(?is)Windows\s*\(x64\).{0,1200}?href=["''](?<url>[^"'']*BigPEmu[^"'']*\.zip)["'']');if(-not$m.Success){throw 'Official x64 BigPEmu link not found'};$href=[Net.WebUtility]::HtmlDecode($m.Groups['url'].Value);$url=$(if($href-match'^https?://'){$href}else{(New-Object Uri ([uri]$pageUrl),$href).AbsoluteUri});$work=Join-Path $env:RUNNER_TEMP 'hc-bigpemu-bootstrap';Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path $work|Out-Null;$zip=Join-Path $work 'BigPEmu.zip';Invoke-WebRequest -UseBasicParsing -Uri $url -Headers $headers -OutFile $zip;$stage=Join-Path $work 'stage';Expand-Archive $zip $stage -Force;$exe=Get-ChildItem $stage -Filter BigPEmu.exe -File -Recurse|Select-Object -First 1;if(-not$exe){throw 'BigPEmu.exe missing'}
          $attempts=New-Object System.Collections.ArrayList
          function Probe([string]$Name,[string[]]$Args,[string]$Expected){
            Remove-Item -LiteralPath $Expected -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path (Split-Path -Parent $Expected)|Out-Null;$p=Start-Process -FilePath $exe.FullName -ArgumentList $Args -WorkingDirectory $exe.Directory.FullName -PassThru;Start-Sleep -Seconds 5;if(-not$p.HasExited){try{$p.CloseMainWindow()|Out-Null;Start-Sleep -Milliseconds 750}catch{};if(-not$p.HasExited){$p.Kill();$p.WaitForExit()}};$exists=Test-Path -LiteralPath $Expected -PathType Leaf;$json=$false;$bytes=0;$sample='';if($exists){$bytes=(Get-Item $Expected).Length;try{$raw=Get-Content -Raw $Expected -Encoding UTF8;$null=$raw|ConvertFrom-Json;$json=$true;$sample=($raw.Substring(0,[Math]::Min(600,$raw.Length)))}catch{}};[void]$attempts.Add([ordered]@{name=$Name;args=$Args;config=$Expected;exists=$exists;bytes=$bytes;jsonValid=$json;sample=$sample})
          }
          $local=Join-Path $exe.Directory.FullName 'UserData\BigPEmuConfig.bigpcfg';Probe 'localdata-setcfgprop' @('*null','-localdata','-setcfgprop','VideoPlugin','BigPEmu_Video_OpenGL') $local
          $absolute=Join-Path $work 'abs\HuymaierBootstrap.bigpcfg';Probe 'cfgpathabs-setcfgprop' @('*null','-cfgpathabs',$absolute,'-setcfgprop','VideoPlugin','BigPEmu_Video_OpenGL') $absolute
          $absolute2=Join-Path $work 'abs2\HuymaierBootstrap.bigpcfg';Probe 'cfgpathabs-setcfgpropcat' @('*null','-cfgpathabs',$absolute2,'-setcfgpropcat','VideoPlugin','BigPEmu_Video_OpenGL','0') $absolute2
          $report=[ordered]@{schemaVersion=1;downloadUrl=$url;sha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();attempts=$attempts;anyGenerated=@($attempts|Where-Object{$_.exists}).Count-gt0};$report|ConvertTo-Json -Depth 8|Set-Content '.development\v0.26.4\bigpemu-bootstrap-research.json' -Encoding UTF8
      - name: Commit research record
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .development/v0.26.4/bigpemu-bootstrap-research.json;if(git diff --cached --quiet){exit 0};git commit -m 'Record BigPEmu documented config bootstrap behavior';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Research rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Research push failed'}
