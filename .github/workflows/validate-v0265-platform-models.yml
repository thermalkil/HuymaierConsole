name: Validate Huymaier Console v0.26.5 Platform Models

on:
  push:
    branches:
      - feature/v0.26.5-performance-and-downloads
      - agent/v0265-recomps-wpf-render-fix
      - agent/v0265-rc9-shader-recomps-picker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huymaier-v0265-platform-model-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate platform model presentation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          try {
            & '.\.development\v0.26.5\Prepare-v0265-PlatformModelValidation.ps1'
            & '.\.development\v0.26.5\Test-v0265-PlatformModels.ps1'
            & '.\.development\v0.26.5\Test-v0265-User3DModels.ps1'
            & '.\.development\v0.26.5\Test-v0265-PlatformNamingAudit.ps1'
            & '.\.development\v0.26.5\Test-v0265-Live3DCardRender.ps1'
            & '.\.development\v0.26.5\Test-v0265-FullModelViewerUvBrightnessV3.ps1'
            & '.\.development\v0.26.5\Test-v0265-ModelMaterialCoverage.ps1'
            & '.\.development\v0.26.5\Test-v0265-GeneratedProviderMaterials.ps1'
            & '.\.development\v0.26.5\Test-v0265-D3D11ColorManagedShelfShader.ps1'
            & '.\.development\v0.26.5\Test-v0265-D3D11ShelfBackend.ps1'
            & '.\.development\v0.26.5\Test-v0265-D3D11FaceCulling.ps1'
            & '.\.development\v0.26.5\Test-v0265-GpuShelfAssetCompiler.ps1'
            & '.\.development\v0.26.5\Test-v0265-MirroredModelWinding.ps1'
            & '.\.development\v0.26.5\Test-v0265-D3D11CachedModelRender.ps1'
            & '.\.development\v0.26.5\Test-v0265-D3D11UvAddressing.ps1'
            & '.\.development\v0.26.5\Test-v0265-GpuPlatformShelvesV7.ps1'
            & '.\.development\v0.26.5\Test-v0265-CanonicalRecomps.ps1'
            & '.\.development\v0.26.5\Test-v0265-RecompsProviderActions.ps1'
            & '.\.development\v0.26.5\Test-v0265-ManualRecomps.ps1'
            & '.\.development\v0.26.5\Test-v0265-ManualRecompsFinalOwnership.ps1'
            & '.\.development\v0.26.5\Test-v0265-RecompsDirectLibrary.ps1'
            & '.\.development\v0.26.5\Test-v0265-RecompsExecutablePicker.ps1'
            & '.\.development\v0.26.5\Test-v0265-RecompsWpfRender.ps1'
          }
          catch {
            $message = [string]$_.Exception.Message
            $message = $message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Platform model validation failed::$message"
            throw
          }
