name: Finalize Huymaier Console v0.26.4 Late Platforms v2
on:
  push:
    branches: [feature/v0.26.4-platform-expansion]
    paths: ['.development/v0.26.4/late-platforms-finalize-v2-request.json']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-late-platforms-v2, cancel-in-progress: false}
jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize final late-platform source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('.development\v0.26.4\apply_mame_release_resolver.py','.development\v0.26.4\apply_vita3k_architecture_resolver.py','.development\v0.26.4\apply_bigpemu_full_settings.py','.development\v0.26.4\apply_fbneo_native_integration.py','.development\v0.26.4\apply_fbneo_first_run_settings.py','.development\v0.26.4\apply_arcade_enable.py','.development\v0.26.4\apply_modern_playstation_launch_enable.py','.development\v0.26.4\apply_source_manifest.py')){python $script;if($LASTEXITCODE-ne0){throw "Materializer failed: $script"}}
      - name: Parse all production PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$files=@(Get-ChildItem . -File -Filter '*.ps1')+@(Get-ChildItem '.\Tools' -File -Filter '*.ps1' -ErrorAction SilentlyContinue);foreach($file in $files){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$($file.Name): $($_.Message)"};throw "PowerShell parse failed: $($file.Name)"}}
      - name: Live-install current x64 backends
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=[ordered]@{};foreach($id in @('PS4','VITA','ARCADE','NEOGEO','JAGUAR')){$root=Join-Path $env:RUNNER_TEMP ('hc-v2-'+$id.ToLower());New-Item -ItemType Directory -Force -Path $root|Out-Null;$json=& .\HuymaierEmulatorInstaller.ps1 -PlatformId $id -DestinationRoot $root -ConsoleRoot (Resolve-Path '.').Path|Select-Object -Last 1;$result=$json|ConvertFrom-Json;$exe=[string]$result.Executable;if(-not(Test-Path $exe -PathType Leaf)){throw "$id installer returned no executable"};$b=[IO.File]::ReadAllBytes($exe);$pe=[BitConverter]::ToInt32($b,0x3c);$machine=[BitConverter]::ToUInt16($b,$pe+4);if($machine-ne0x8664){throw "$id is not x64: 0x$($machine.ToString('X4'))"};$installed[$id]=$exe;Write-Host "$id => $exe"};$installed|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'late-v2-installed.json') -Encoding UTF8
      - name: Prove MAME dynamic settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'late-v2-installed.json')|ConvertFrom-Json;$exe=[string]$installed.ARCADE;$psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=$exe;$psi.Arguments='-showconfig';$psi.WorkingDirectory=Split-Path -Parent $exe;$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$p=[Diagnostics.Process]::Start($psi);$stdout=$p.StandardOutput.ReadToEnd();$stderr=$p.StandardError.ReadToEnd();if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'MAME -showconfig timed out'};if($stdout-notmatch'(?im)^\s*rompath\s' -or $stdout-notmatch'(?im)^\s*video\s'){throw 'MAME -showconfig did not expose expected complete runtime options'}
      - name: Prove FBNeo hidden first-run config
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installed=Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'late-v2-installed.json')|ConvertFrom-Json;$exe=[string]$installed.NEOGEO;$root=Split-Path -Parent $exe;$config=Join-Path $root ('config\'+[IO.Path]::GetFileNameWithoutExtension($exe)+'.ini');Remove-Item $config -Force -ErrorAction SilentlyContinue
          function Start-Hidden([string]$Arguments){$out=Join-Path $env:RUNNER_TEMP ('fbneo-'+[guid]::NewGuid().ToString('N')+'.out');$err=Join-Path $env:RUNNER_TEMP ('fbneo-'+[guid]::NewGuid().ToString('N')+'.err');try{$s=@{FilePath=$exe;WorkingDirectory=$root;PassThru=$true;WindowStyle='Hidden';RedirectStandardOutput=$out;RedirectStandardError=$err};if($Arguments){$s.ArgumentList=$Arguments};$p=Start-Process @s;$deadline=[DateTime]::UtcNow.AddSeconds(5);while([DateTime]::UtcNow-lt$deadline-and-not(Test-Path $config -PathType Leaf)){if($p.HasExited){break};Start-Sleep -Milliseconds 150};if(-not$p.HasExited){try{[void]$p.CloseMainWindow()}catch{};try{[void]$p.WaitForExit(2500)}catch{}};if(-not$p.HasExited){try{$p.Kill();$p.WaitForExit()}catch{}}}finally{Remove-Item $out,$err -Force -ErrorAction SilentlyContinue};return (Test-Path $config -PathType Leaf)}
          $generated=Start-Hidden '-listinfo';if(-not$generated){$generated=Start-Hidden ''};if(-not$generated){throw 'FBNeo could not persist its authoritative config from hidden first-run initialization'};$raw=Get-Content -Raw $config -Encoding UTF8;if($raw-notmatch'(?m)^szAppRomPaths\[0\]\s+' -or $raw-notmatch'(?m)^nVidVSync\s+'){throw 'FBNeo persisted config is incomplete'};Write-Host "FBNeo config generated: $config"
      - name: Prove preservation-safe BigPEmu and FBNeo edits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$script:BaseDir=(Resolve-Path '.').Path;function Write-Log{};function Get-EntryProperty{param($Object,[string]$Name,$Default=$null);if($null-ne$Object){$p=$Object.PSObject.Properties[$Name];if($p){return $p.Value}};return $Default};. .\HuymaierEmulatorSettings.ps1
          $big=Join-Path $env:RUNNER_TEMP 'BigPEmuConfig.bigpcfg';([ordered]@{VideoPlugin='BigPEmu_Video_OpenGL';FutureUnknownSetting=123;Nested=[ordered]@{HDR=$true;Scale=2}}|ConvertTo-Json -Depth 6)|Set-Content $big -Encoding UTF8;$items=@(Get-HcEmulatorConfigSettings -AdapterId 'bigpemu' -Path $big);$item=$items|Where-Object{$_.Key-eq'VideoPlugin'}|Select-Object -First 1;if($null-eq$item-or[string]$item.Format-ne'json'){throw 'BigPEmu .bigpcfg did not enumerate as JSON'};$backup=Join-Path $env:LOCALAPPDATA 'Huymaier Console\EmulatorPlatforms\ConfigBackups\bigpemu';$before=@(Get-ChildItem $backup -File -Recurse -ErrorAction SilentlyContinue).Count;Set-HcEmulatorConfigSetting -Setting $item -Value 'BigPEmu_Video_D3D12';$obj=Get-Content -Raw $big|ConvertFrom-Json;if($obj.VideoPlugin-ne'BigPEmu_Video_D3D12'-or$obj.FutureUnknownSetting-ne123-or-not$obj.Nested.HDR-or$obj.Nested.Scale-ne2){throw 'BigPEmu preservation failed'};if(@(Get-ChildItem $backup -File -Recurse -ErrorAction SilentlyContinue).Count-le$before){throw 'BigPEmu backup missing'}
          $fb=Join-Path $env:RUNNER_TEMP 'fbneo-test.ini';@('// keep','nVidVSync 1','FutureUnknownOption 987','szAppRomPaths[0] X:\ROMs\')|Set-Content $fb -Encoding UTF8;$items=@(Get-HcEmulatorConfigSettings -AdapterId 'fbneo' -Path $fb);$item=$items|Where-Object{$_.Key-eq'nVidVSync'}|Select-Object -First 1;if($null-eq$item-or[string]$item.Format-ne'key-value'){throw 'FBNeo config did not enumerate as key-value'};Set-HcEmulatorConfigSetting -Setting $item -Value '0';$raw=Get-Content -Raw $fb;if($raw-notmatch'(?m)^nVidVSync 0$'-or$raw-notmatch'FutureUnknownOption 987'-or$raw-notmatch'// keep'){throw 'FBNeo preservation failed'}
      - name: Validate graduation contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installer=Get-Content -Raw HuymaierEmulatorInstaller.ps1 -Encoding UTF8;if($installer-match'Get-GithubLatestAssets'){throw 'Undefined legacy release helper remains'};foreach($m in @("Get-GithubReleaseAsset 'mamedev/mame'","'windows-latest.zip'")){if($installer-notmatch[regex]::Escape($m)){throw "Installer marker missing: $m"}}
          $worker=Get-Content -Raw HuymaierEmulatorSettingsWorker.ps1 -Encoding UTF8;foreach($m in @('Invoke-FbNeoHiddenInitialization','Initialize-FbNeoConfigIfNeeded')){if($worker-notmatch[regex]::Escape($m)){throw "FBNeo first-run marker missing: $m"}}
          $native=Get-Content -Raw Native\HuymaierConsole.ConsolePlatforms.cs -Encoding UTF8;foreach($m in @('EnsureFbNeoRomPath','BuildMameOverrideArguments','-rompath','shad.Append("-g ")','"-r " + QuoteProcessArgument(titleId)','RefreshModernPlayStationLibrary(showNotice)','RenderPs4DynamicMenu','RenderVitaLiveArea','RenderArcadeOperatorSettings','RenderArcadeStorage')){if($native-notmatch[regex]::Escape($m)){throw "Native marker missing: $m"}};if($native-match'LeftShoulder[^\r\n]{0,200}SwitchPage'-or$native-match'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulder buttons switch ordinary pages'}
          $reg=Get-Content -Raw EmulatorPlatforms\platform-registry.json -Encoding UTF8|ConvertFrom-Json;foreach($id in @('arcade','finalburnneo','neogeo','ps4','vita')){$e=@($reg.platforms|Where-Object{$_.id-eq$id});if($e.Count-ne1-or-not[bool]$e[0].enabled){throw "$id not enabled exactly once"};if(@($e[0].capabilities)-notcontains'native-full-emulator-settings'){throw "$id missing full-settings capability"}};$j=Get-Content -Raw EmulatorPlatforms\Jaguar\platform.json -Encoding UTF8|ConvertFrom-Json;if([bool]$j.enabled){throw 'Jaguar must remain staged pending first-run BigPEmu config proof'}
      - name: Compile exact combined x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$src=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-v0264-late-v2.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$src;& $csc @args;if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'Exact combined x64 compile failed'}
      - name: Commit exact validated late-platform source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorInstaller.ps1 HuymaierEmulatorSettings.ps1 HuymaierEmulatorSettingsWorker.ps1 Native/HuymaierConsole.ConsolePlatforms.cs EmulatorPlatforms/Arcade/platform.json EmulatorPlatforms/FinalBurnNeo/platform.json EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/PS4/platform.json EmulatorPlatforms/Vita/platform.json EmulatorPlatforms/platform-registry.json manifest.json .source/source-files.txt;if(git diff --cached --quiet){Write-Host 'Already materialized';exit 0};git commit -m 'Finalize validated v0.26.4 late platform source';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'Push failed'}
