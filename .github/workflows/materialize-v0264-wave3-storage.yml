name: Materialize Huymaier Console v0.26.4 Wave 3 Storage and Settings

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave3-storage-request.json'
      - '.development/v0.26.4/apply_wave3_storage_settings.py'
      - '.github/workflows/materialize-v0264-wave3-storage.yml'
permissions:
  contents: write
concurrency:
  group: huymaier-v0264-wave3-storage
  cancel-in-progress: false
jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize Wave 3 storage and settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;if($native -notmatch [regex]::Escape('private void RenderWave3Settings()')){python .development\v0.26.4\apply_wave3_storage_settings.py;if($LASTEXITCODE -ne 0){throw 'Wave 3 storage/settings materializer failed.'}}
      - name: Validate and compile Wave 3 native behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('RenderWave3Settings','RenderWave3Storage','FindWave3SaveFiles','OpenNativeBackendSettings')){if($native -notmatch [regex]::Escape($m)){throw "Wave 3 invariant missing: $m"}}
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave3-storage.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave 3 storage/settings x64 compile failed.'}
      - name: Commit validated Wave 3 storage/settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs;if(git diff --cached --quiet){Write-Host 'No Wave 3 storage changes.';exit 0};git commit -m 'Materialize v0.26.4 Wave 3 native storage and settings';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 3 storage rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 3 storage push failed.'}
