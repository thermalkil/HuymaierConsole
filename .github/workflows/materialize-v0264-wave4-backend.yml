name: Materialize Huymaier Console v0.26.4 Arcade Backends

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave4-backend-request.json'
      - '.development/v0.26.4/apply_wave4_backend.py'
      - '.github/workflows/materialize-v0264-wave4-backend.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-wave4-backend
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Materialize MAME and FBNeo adapters
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$installer=Get-Content -Raw 'HuymaierEmulatorInstaller.ps1' -Encoding UTF8;if($installer -notmatch [regex]::Escape('function Install-MameLatest')){python .development\v0.26.4\apply_wave4_backend.py;if($LASTEXITCODE -ne 0){throw 'Wave 4 backend materializer failed.'}}
      - name: Parse and validate arcade backend contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';foreach($path in @('.\HuymaierEmulatorInstaller.ps1','.\HuymaierEmulatorSettingsWorker.ps1','.\HuymaierNativeConsoleLibraryWorker.ps1')){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$path : $($_.Message)"};throw "$path parse failed."}}
          $installer=Get-Content -Raw 'HuymaierEmulatorInstaller.ps1' -Encoding UTF8;foreach($required in @('function Install-MameLatest','mamedev/mame','MAME self-extractor','finalburnneo/FBNeo')){if($installer -notmatch [regex]::Escape($required)){throw "Arcade installer invariant missing: $required"}}
          $worker=Get-Content -Raw 'HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;foreach($required in @('Get-MameConfigText','-showconfig','Get-MameCliSettings','Set-MameCliOverride','mame-command-line-overrides.json')){if($worker -notmatch [regex]::Escape($required)){throw "MAME full-settings invariant missing: $required"}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($required in @('BuildMameOverrideArguments','-rompath','definition.Shell == "Arcade" && exe.IndexOf("mame"')){if($native -notmatch [regex]::Escape($required)){throw "MAME launch invariant missing: $required"}}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave4.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Arcade backend x64 compile failed.'}
      - name: Commit validated arcade backend source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add HuymaierEmulatorInstaller.ps1 HuymaierEmulatorSettingsWorker.ps1 HuymaierNativeConsoleLibraryWorker.ps1 Native/HuymaierConsole.ConsolePlatforms.cs;if(git diff --cached --quiet){Write-Host 'No arcade backend changes.';exit 0};git commit -m 'Materialize v0.26.4 MAME and FBNeo backend integration';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Arcade backend rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Arcade backend push failed.'}
