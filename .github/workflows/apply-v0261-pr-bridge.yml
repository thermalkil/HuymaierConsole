name: Apply v0.26.1 PR Development Batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v0261-pr-development-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-development:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/v0.26.1-installer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix head branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v0.26.1-installer
          fetch-depth: 0

      - name: Apply requested v0.26.1 development batch
        shell: bash
        run: |
          set -euo pipefail
          DEV_DIR='.development/v0.26.1'
          APPLY="$DEV_DIR/apply.json"
          STATUS="$DEV_DIR/status.json"
          BATCH="$(python3 -c "import json;print(json.load(open('$APPLY'))['batch'])")"
          SCRIPT="$(python3 -c "import json;print(json.load(open('$APPLY')).get('script',''))")"
          PATCH_DIR="$(python3 -c "import json;print(json.load(open('$APPLY')).get('patch_dir',''))")"
          LAST=''
          if [ -f "$STATUS" ]; then LAST="$(python3 -c "import json;print(json.load(open('$STATUS')).get('batch',''))")"; fi
          if [ "$LAST" = "$BATCH" ]; then
            echo "Development batch $BATCH is already applied."
            exit 0
          fi

          if [ -n "$SCRIPT" ]; then
            TRANSFORMER="$DEV_DIR/$SCRIPT"
            test -f "$TRANSFORMER"
            python3 "$TRANSFORMER"
          elif [ -n "$PATCH_DIR" ]; then
            shopt -s nullglob
            patches=("$PATCH_DIR"/*.patch)
            test "${#patches[@]}" -gt 0
            for patch in "${patches[@]}"; do git apply --check --whitespace=nowarn "$patch"; done
            for patch in "${patches[@]}"; do git apply --whitespace=nowarn "$patch"; done
          else
            echo 'apply.json requires either script or patch_dir.'
            exit 1
          fi

          python3 - <<PY
          import json,datetime
          state={
            'batch':'$BATCH',
            'script':'$SCRIPT',
            'patch_dir':'$PATCH_DIR',
            'result':'success',
            'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('$STATUS','w',encoding='utf-8').write(json.dumps(state,indent=2)+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply v0.26.1 PR development batch $BATCH"
          git push origin HEAD:hotfix/v0.26.1-installer
