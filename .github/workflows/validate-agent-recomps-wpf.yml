name: Validate Recomps WPF Renderer
on:
  push:
    branches: [agent/v0265-recomps-wpf-render-fix]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute real WPF render test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\.development\v0.26.5\Test-v0265-RecompsWpfRender.ps1'),[ref]$t,[ref]$e)
          if($e.Count){$e|ForEach-Object{Write-Host $_.Message};throw 'WPF render test failed PowerShell 5.1 parse'}
          & '.\.development\v0.26.5\Test-v0265-RecompsWpfRender.ps1'
