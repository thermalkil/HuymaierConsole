name: Sync Huymaier Console Source From Release

on:
  push:
    branches: [ main ]
    paths:
      - '.source/sync.json'

permissions:
  contents: write

concurrency:
  group: huymaier-console-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync request
        id: request
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          data=json.load(open('.source/sync.json',encoding='utf-8'))
          tag=str(data.get('tag','')).strip()
          if not tag: raise SystemExit('sync.json must contain a release tag.')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f'tag={tag}\n')
          PY

      - name: Download full release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hc-source-release /tmp/hc-source-extract
          mkdir -p /tmp/hc-source-release /tmp/hc-source-extract
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir /tmp/hc-source-release
          ZIP="$(find /tmp/hc-source-release -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          [ -n "$ZIP" ] && [ -f "$ZIP" ] || { echo 'Release ZIP not found.'; exit 1; }
          unzip -q "$ZIP" -d /tmp/hc-source-extract
          mapfile -t roots < <(find /tmp/hc-source-extract -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -eq 1 ]; then ROOT="${roots[0]}"; else ROOT='/tmp/hc-source-extract'; fi
          echo "SOURCE_PACKAGE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Replace synchronized source/configuration tree
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, pathlib, json, datetime
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          src=pathlib.Path(os.environ['SOURCE_PACKAGE_ROOT'])
          list_path=repo/'.source/source-files.txt'

          # Remove files managed by the previous source sync before copying the new set.
          if list_path.exists():
              for raw in list_path.read_text(encoding='utf-8').splitlines():
                  rel=raw.strip()
                  if not rel: continue
                  p=repo/rel
                  if p.is_file() or p.is_symlink(): p.unlink()

          allowed={'.ps1','.cmd','.cs','.json','.txt','.md','.xml','.sccd'}
          excluded={'SHA256SUMS.txt','checksums.sha256'}
          copied=[]
          for p in src.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(src).as_posix()
              if rel in excluded: continue
              if p.suffix.lower() not in allowed and p.name != '.keep': continue
              # Release-management files belong to the repository, not the packaged runtime.
              if rel.startswith('.github/') or rel.startswith('.release/') or rel.startswith('.source/'): continue
              dest=repo/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dest)
              copied.append(rel)

          copied=sorted(set(copied),key=str.lower)
          list_path.parent.mkdir(parents=True,exist_ok=True)
          list_path.write_text('\n'.join(copied)+'\n',encoding='utf-8')
          status={
              'tag':os.environ['TAG'], 'result':'success', 'files':len(copied),
              'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          (repo/'.source/status.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(f'Synchronized {len(copied)} text/source/configuration files from {os.environ["TAG"]}.')
          PY

      - name: Commit synchronized source
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source tree already matches the requested release.'
            exit 0
          fi
          git commit -m "Sync source tree from $TAG"
          git push
