name: Apply Huymaier Console v0.26.4 Stage 1

on:
  push:
    branches:
      - feature/v0.26.4-platform-expansion
    paths:
      - '.development/v0.26.4/apply.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize stage one
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .development\v0.26.4\apply_stage1.py
          if($LASTEXITCODE -ne 0){throw 'v0.26.4 stage-one materializer failed.'}
          $parserErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierConsole.ps1'),[ref]$null,[ref]$parserErrors)
          if($parserErrors.Count -gt 0){$parserErrors|ForEach-Object{Write-Host $_};throw 'HuymaierConsole.ps1 does not parse after v0.26.4 stage one.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HuymaierConsole.ps1 manifest.json
          if(git diff --cached --quiet){throw 'Stage-one materializer produced no production changes.'}
          git commit -m 'Materialize v0.26.4 artwork settings and expansion stage one'
          git push origin HEAD:feature/v0.26.4-platform-expansion
