name: Correct v0.26.4 Wave 3 Readiness
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/wave3-readiness-request.json','.development/v0.26.4/apply_wave3_readiness_correction.py','.github/workflows/materialize-v0264-wave3-readiness.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-wave3-readiness, cancel-in-progress: false}
jobs:
  correct:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Keep Neo Geo staged until installer probe passes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .development\v0.26.4\apply_wave3_readiness_correction.py;if($LASTEXITCODE){throw 'Wave3 readiness correction failed'}
      - name: Validate readiness boundary
        shell: powershell
        run: |
          $r=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json;$e=@($r.platforms|Where-Object{$_.id -eq 'neogeo'});if($e.Count -gt 0 -and [bool]$e[0].enabled){throw 'Neo Geo is enabled before FBNeo binary resolution is proven.'};$d=Get-Content -Raw 'EmulatorPlatforms\NeoGeo\platform.json' -Encoding UTF8|ConvertFrom-Json;if([bool]$d.enabled){throw 'NeoGeo platform definition is enabled prematurely.'}
      - name: Commit readiness correction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add EmulatorPlatforms/NeoGeo/platform.json EmulatorPlatforms/platform-registry.json .github/workflows/validate-v0264-expansion.yml Docs/PLATFORM-IMPLEMENTATION-STATUS-v0.26.4.md;if(git diff --cached --quiet){exit 0};git commit -m 'Keep Neo Geo staged pending FBNeo binary resolver proof';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Readiness rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Readiness push failed'}
