name: Fix V6 probe numeric literals

on:
  push:
    paths:
      - '.github/workflows/fix-v6-probe-literals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Fix strict-mode float casts and self-clean
        shell: python
        run: |
          from pathlib import Path
          targets = [
              Path('.development/v0.26.5/Test-v0265-Live3DCardRender.ps1'),
              Path('.build/Test-HuymaierV0265PlatformModelsCandidate.ps1'),
          ]
          for p in targets:
              text = p.read_text(encoding='utf-8-sig')
              before = text
              text = text.replace('[single]-.72', '[single](-0.72)')
              text = text.replace('[single].72', '[single](0.72)')
              if text == before:
                  raise SystemExit(f'{p}: expected strict-mode float literals were not found')
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-v6-probe-literals.yml').unlink()
      - name: Commit V6 probe literal correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict-mode V6 material probe float literals'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
