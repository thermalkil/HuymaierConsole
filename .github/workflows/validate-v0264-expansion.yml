name: Validate Huymaier Console v0.26.4 Platform Expansion

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
  push:
    branches:
      - feature/v0.26.4-platform-expansion

permissions:
  contents: read

concurrency:
  group: huymaier-v0264-expansion-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse all production PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath . -File -Filter '*.ps1')+@(Get-ChildItem -LiteralPath '.\Tools' -File -Filter '*.ps1' -ErrorAction SilentlyContinue)
          foreach($file in $files){$tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Host "$($file.FullName): $($_.Message)"};throw "PowerShell 5.1 parse failed: $($file.Name)"}}
      - name: Validate complete expansion inventory and atomic enablement discipline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $plan=Get-Content -Raw '.development\v0.26.4\platform-expansion.json' -Encoding UTF8|ConvertFrom-Json
          if(@($plan.missingPlatforms).Count -ne 27){throw 'The supplied ROM-root inventory must contain exactly 27 expansion targets.'}
          $ids=@{};foreach($target in @($plan.missingPlatforms)){if([string]::IsNullOrWhiteSpace([string]$target.id)-or[string]::IsNullOrWhiteSpace([string]$target.primaryBackend)){throw 'Expansion target lacks id/backend.'};if($ids.ContainsKey([string]$target.id)){throw "Duplicate expansion target id: $($target.id)"};$ids[[string]$target.id]=$true}
          $registry=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json
          $registryIds=@{};foreach($entry in @($registry.platforms)){if($registryIds.ContainsKey([string]$entry.id)){throw "Duplicate platform registry id: $($entry.id)"};$registryIds[[string]$entry.id]=$true}
          foreach($id in @('psp','nds','dsi','3ds','dreamcast','saturn')){$entry=@($registry.platforms|Where-Object{$_.id -eq $id});if($entry.Count -ne 1 -or -not [bool]$entry[0].enabled){throw "Wave 1 platform is not enabled exactly once: $id"}}

          function Test-AtomicWave([string[]]$Ids,[string]$Label){
            $states=@();foreach($id in $Ids){$entry=@($registry.platforms|Where-Object{$_.id -eq $id});if($entry.Count -gt 1){throw "$Label duplicate registry entry: $id"};$states+=($entry.Count -eq 1 -and [bool]$entry[0].enabled)}
            $enabled=@($states|Where-Object{$_}).Count
            if($enabled -ne 0 -and $enabled -ne $Ids.Count){throw "$Label is partially enabled ($enabled/$($Ids.Count)); platform graduation must be atomic."}
            return ($enabled -eq $Ids.Count)
          }
          $wave2=@('atari2600','nes','snes','gameboy','gbc','gba','genesis','segacd','sega32x','gamegear','mastersystem','turbografx16')
          $wave3=@('atarilynx','ngpc','primehack')
          $wave2Enabled=Test-AtomicWave $wave2 'Wave 2'
          $wave3Enabled=Test-AtomicWave $wave3 'Wave 3 validated subset'
          if($wave2Enabled){foreach($id in $wave2){$entry=@($registry.platforms|Where-Object{$_.id -eq $id})[0];foreach($cap in @('latest-emulator-install','native-full-emulator-settings','unknown-setting-preservation','native-save-management','alphabet-index')){if(@($entry.capabilities)-notcontains$cap){throw "$id is enabled without $cap"}}}}
          if($wave3Enabled){foreach($id in $wave3){$entry=@($registry.platforms|Where-Object{$_.id -eq $id})[0];foreach($cap in @('latest-emulator-install','native-full-emulator-settings','native-save-management')){if(@($entry.capabilities)-notcontains$cap){throw "$id is enabled without $cap"}}}}

          # These remain staged until their dedicated readiness blockers are solved.
          foreach($folder in @('NeoGeo','Jaguar','Arcade','FinalBurnNeo','PS4','Vita')){
            $path=Join-Path (Join-Path 'EmulatorPlatforms' $folder) 'platform.json';if(-not(Test-Path $path)){continue};$definition=Get-Content -Raw $path -Encoding UTF8|ConvertFrom-Json;if([bool]$definition.enabled){throw "$folder is enabled before its dedicated readiness gate passed."}
          }
      - name: Validate native settings artwork and navigation invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $shell=Get-Content -Raw 'HuymaierConsole.ps1' -Encoding UTF8
          foreach($required in @("Title='Artwork & Metadata'","SteamGridDB artwork key: Configured","SteamGridDB artwork key: Not configured")){if($shell -notmatch [regex]::Escape($required)){throw "Artwork discoverability invariant missing: $required"}}
          $settings=Get-Content -Raw 'HuymaierEmulatorSettings.ps1' -Encoding UTF8
          foreach($required in @('Backup-HcEmulatorConfigFile','Get-HcCompleteEmulatorSettingsInventory','Set-HcEmulatorConfigSetting','Get-HcJsonSettings','Set-HcJsonSetting','Get-HcTomlScalarSettings','Get-HcXmlSettings','Set-HcXmlSetting')){if($settings -notmatch [regex]::Escape($required)){throw "Full emulator settings invariant missing: $required"}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if($native -match 'LeftShoulder[^\r\n]{0,200}SwitchPage' -or $native -match 'RightShoulder[^\r\n]{0,200}SwitchPage'){throw 'Shoulder buttons may not switch native console pages.'}
          foreach($required in @('TryProcessLibraryLetterJump','OpenNativeBackendSettings','RequestHuymaierPicker','Huymaier Game Bar')){if($native -notmatch [regex]::Escape($required)){throw "Native navigation/settings invariant missing: $required"}}
      - name: Keep PlayStation 1 2 3 presentation source frozen
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git diff --quiet 9f3b5b390dd24f82ecce129c1e25dbc97bf598a5 -- Native/HuymaierConsole.Ps1.cs EmulatorPlatforms/PS1 EmulatorPlatforms/PS2 EmulatorPlatforms/PS3
          if($LASTEXITCODE -ne 0){git diff -- 9f3b5b390dd24f82ecce129c1e25dbc97bf598a5 -- Native/HuymaierConsole.Ps1.cs EmulatorPlatforms/PS1 EmulatorPlatforms/PS2 EmulatorPlatforms/PS3;throw 'Frozen PlayStation platform presentation/config assets changed on the expansion branch.'}
      - name: Compile exact x64 native host source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';if(-not(Test-Path $csc)){throw 'Framework64 csc.exe missing.'};$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-validation.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0 -or -not(Test-Path $out)){throw 'Expansion branch x64 native compile failed.'}
