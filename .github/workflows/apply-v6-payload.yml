name: Clean temporary v0.26.5 V6 payload

on:
  push:
    paths:
      - '.development/v0.26.5/apply-v6.trigger'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0

      - name: Remove temporary V6 transfer infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          rm -rf .development/v0.26.5/payload-v6
          rm -f .development/v0.26.5/apply-v6.trigger
          rm -f .github/workflows/apply-v6-payload.yml
          git add -A
          git diff --cached --quiet && { echo 'Temporary V6 transfer infrastructure already absent.'; exit 0; }
          git commit -m 'Remove temporary V6 source transfer infrastructure'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
