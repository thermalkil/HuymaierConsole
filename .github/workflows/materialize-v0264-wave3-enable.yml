name: Enable Huymaier Console v0.26.4 Wave 3 Validated Platforms
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/wave3-enable-request.json','.development/v0.26.4/apply_wave3_partial_enable.py','.github/workflows/materialize-v0264-wave3-enable.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-wave3-enable, cancel-in-progress: false}
jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Ensure Wave 3 prerequisites and graduate validated platforms
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;if($n -notmatch [regex]::Escape('private bool IsWave3Shell()')){python .development\v0.26.4\apply_wave3_stage.py;if($LASTEXITCODE){throw 'Wave3 stage failed'}};$i=Get-Content -Raw 'HuymaierEmulatorInstaller.ps1' -Encoding UTF8;if($i -notmatch [regex]::Escape('function Install-BigPEmuLatest')){python .development\v0.26.4\apply_wave3_backend.py;if($LASTEXITCODE){throw 'Wave3 backend failed'}};$n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;if($n -notmatch [regex]::Escape('private void RenderWave3Settings()')){python .development\v0.26.4\apply_wave3_storage_settings.py;if($LASTEXITCODE){throw 'Wave3 storage failed'}};python .development\v0.26.4\apply_wave3_partial_enable.py;if($LASTEXITCODE){throw 'Wave3 graduation failed'};python .development\v0.26.4\apply_source_manifest.py
      - name: Validate enabled specialty platform contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$r=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json;foreach($id in @('atarilynx','neogeo','ngpc','primehack')){$e=@($r.platforms|Where-Object{$_.id -eq $id});if($e.Count-ne 1-or-not[bool]$e[0].enabled){throw "$id not enabled exactly once"};foreach($cap in @('latest-emulator-install','native-full-emulator-settings','native-save-management')){if(@($e[0].capabilities)-notcontains$cap){throw "$id missing $cap"}}};$j=Get-Content -Raw 'EmulatorPlatforms\Jaguar\platform.json' -Encoding UTF8|ConvertFrom-Json;if([bool]$j.enabled){throw 'Jaguar must remain disabled until BigPEmu full-settings audit is complete.'}
          $w=Get-Content -Raw 'HuymaierEmulatorSettingsWorker.ps1' -Encoding UTF8;foreach($a in @("'mednafen'","'fbneo'","'primehack'")){if($w -notmatch [regex]::Escape($a)){throw "Wave3 settings discovery missing $a"}};$n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('RenderAtariLynxHandheld','RenderNeoGeoDeck','RenderNgpcHandheld','RenderPrimeHackVisor','RenderWave3Settings','RenderWave3Storage')){if($n -notmatch [regex]::Escape($m)){throw "Wave3 native marker missing $m"}}
      - name: Parse PowerShell and compile x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';foreach($p in @('.\HuymaierEmulatorInstaller.ps1','.\HuymaierEmulatorSettings.ps1','.\HuymaierEmulatorSettingsWorker.ps1')){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e);if($e.Count){throw "$p parse failed"}};Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-wave3-enable.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne 0){throw 'Wave3 graduation x64 compile failed'}
      - name: Commit validated Wave 3 graduation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add -A;if(git diff --cached --quiet){exit 0};git commit -m 'Enable validated v0.26.4 Wave 3 specialty platforms';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Wave3 graduation rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'Wave3 graduation push failed'}
