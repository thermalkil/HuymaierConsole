name: Fix V7 load-order validation sequence
on:
  push:
    paths: ['.github/workflows/fix-v7-load-order-test.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.5-performance-and-downloads, fetch-depth: 0}
      - name: Match release transform order and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.development/v0.26.5/Test-v0265-GpuPlatformShelvesV7.ps1')
          text=p.read_text(encoding='utf-8-sig')
          old="""    $core=Join-Path $temp 'HuymaierConsole.ps1';$bootstrap=Join-Path $temp 'HuymaierBootstrap.ps1';$installer=Join-Path $temp 'Install-HuymaierConsole.ps1'\n    Copy-Item (Join-Path $root 'HuymaierConsole.ps1') $core;Copy-Item (Join-Path $root 'HuymaierBootstrap.ps1') $bootstrap;Copy-Item (Join-Path $root 'Install-HuymaierConsole.ps1') $installer\n    & $userOptimizer -CorePath $core -BootstrapPath $bootstrap -InstallerScriptPath $installer\n"""
          new="""    $core=Join-Path $temp 'HuymaierConsole.ps1';$bootstrap=Join-Path $temp 'HuymaierBootstrap.ps1';$installer=Join-Path $temp 'Install-HuymaierConsole.ps1';$builder=Join-Path $temp 'Build-HuymaierReleaseCandidate.Core.ps1'\n    Copy-Item (Join-Path $root 'HuymaierConsole.ps1') $core;Copy-Item (Join-Path $root 'HuymaierBootstrap.ps1') $bootstrap;Copy-Item (Join-Path $root 'Install-HuymaierConsole.ps1') $installer;Copy-Item (Join-Path $root '.build\\Build-HuymaierReleaseCandidate.Core.ps1') $builder\n    & $platformOptimizer -CorePath $core -BootstrapPath $bootstrap -InstallerScriptPath $installer -CoreBuilderPath $builder\n    & $userOptimizer -CorePath $core -BootstrapPath $bootstrap -InstallerScriptPath $installer\n"""
          if old not in text: raise SystemExit('V7 isolated load-order block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-v7-load-order-test.yml').unlink()
      - name: Commit validator sequencing fix
        shell: bash
        run: |
          git config user.name thermalkil
          git config user.email 98826286+thermalkil@users.noreply.github.com
          git add -A
          git commit -m 'Validate V7 ownership in real release transform order'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
