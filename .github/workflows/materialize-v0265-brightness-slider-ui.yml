name: Materialize v0.26.5 Brightness Slider UI

on:
  push:
    branches:
      - feature/v0.26.5-performance-and-downloads

permissions:
  contents: write

concurrency:
  group: huymaier-v0265-brightness-slider-ui
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply and validate brightness slider UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\.development\v0.26.5\Apply-v0265-BrightnessSliderUiFix.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierUser3DModels.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw "HuymaierUser3DModels.ps1 parse failed: $(@($errors|ForEach-Object{$_.Message}) -join '; ')"}
          $text=Get-Content -Raw '.\HuymaierUser3DModels.ps1' -Encoding UTF8
          foreach($needle in @("'3D model brightness'","'platform-model-brightness-slider'{[void](Adjust-SelectedSlider 5);return}",'PlatformModelBrightness')){if($text.IndexOf($needle,[StringComparison]::Ordinal)-lt0){throw "Brightness UI contract missing: $needle"}}
          Write-Host 'platformModelBrightnessSliderUiGate: success'
      - name: Commit production UI fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'huymaier-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- HuymaierUser3DModels.ps1
          if(git diff --cached --quiet){Write-Host 'Brightness UI already materialized.';exit 0}
          git commit -m 'Materialize 3D model brightness slider UI'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
