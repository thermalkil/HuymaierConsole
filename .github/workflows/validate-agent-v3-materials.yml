name: Validate HC3D v3 Materials
on:
  push:
    branches: [agent/v0265-recomps-wpf-render-fix]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile managed HC3D v3 compiler
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $framework=[Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()
          $refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,[ComponentModel.ISupportInitialize].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,(Join-Path $framework 'System.Xaml.dll'))|Select-Object -Unique
          $out=Join-Path $env:RUNNER_TEMP 'HuymaierGpuAssetCompiler.dll'
          $args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=@('.\Native\HuymaierModelPreviewWorker.cs','.\Native\HuymaierModelPreviewWpfAliases.cs','.\Native\HuymaierGpuShelfAssetCompiler.cs')
          & $csc @args
          if($LASTEXITCODE-ne0-or-not(Test-Path $out)){throw 'HC3D v3 managed compiler failed.'}
      - name: Compile native HC3D v3 renderer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not$vs){throw 'MSVC x64 tools unavailable.'}
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $dll=Join-Path $env:RUNNER_TEMP 'HuymaierD3D11ShelfRenderer.dll'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-v3.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /LD /O2 /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE /I"%GITHUB_WORKSPACE%\Native" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfRenderer.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfAsset.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11ShelfRuntime.cpp" "%GITHUB_WORKSPACE%\Native\HuymaierD3D11UvAddressSmoke.cpp" /link /OUT:"$dll" d3d11.lib d3d9.lib d3dcompiler.lib dxgi.lib user32.lib ole32.lib
          exit /b %errorlevel%
          "@|Set-Content $cmd -Encoding ASCII
          &cmd.exe /d /c ('"'+$cmd+'"')
          if($LASTEXITCODE-ne0-or-not(Test-Path $dll)){throw 'HC3D v3 native renderer failed.'}
