name: Materialize Huymaier Console v0.26.4 PS4 Vita Installed Content
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/wave5-content-request.json','.development/v0.26.4/apply_wave5_installed_content.py','.github/workflows/materialize-v0264-wave5-content.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-wave5-content, cancel-in-progress: false}
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Materialize installed application model
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;if($native -notmatch [regex]::Escape('RefreshModernPlayStationLibrary(showNotice)')){python .development\v0.26.4\apply_wave5_installed_content.py;if($LASTEXITCODE -ne 0){throw 'PS4/Vita installed-content materializer failed.'}}
      - name: Validate installed-content semantics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('RefreshModernPlayStationLibrary','CreateModernPlayStationGame','sce_sys","param.sfo','sce_sys","icon0.png','eboot.bin')){if($native -notmatch [regex]::Escape($m)){throw "Modern installed-content invariant missing: $m"}}
          $worker=Get-Content -Raw 'HuymaierNativeConsoleLibraryWorker.ps1' -Encoding UTF8;foreach($m in @('Count-ModernInstalledApplications',"@('PS4','VITA')",'sce_sys\param.sfo','eboot.bin')){if($worker -notmatch [regex]::Escape($m)){throw "Modern count invariant missing: $m"}}
          # Package archives remain install media; the native modern scanner must not add them as ordinary games.
          $start=$native.IndexOf('private void RefreshModernPlayStationLibrary');$end=$native.IndexOf('private static string CleanName',$start);if($start -lt 0 -or $end -le $start){throw 'Could not isolate modern installed library scanner.'};$block=$native.Substring($start,$end-$start);if($block -match '\.(pkg|vpk)'){throw 'Modern installed library scanner still treats package archives as playable entries.'}
      - name: Parse worker and compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\HuymaierNativeConsoleLibraryWorker.ps1'),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host $_.Message};throw 'Modern count worker parse failed.'};Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-wave5-content.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'PS4/Vita installed-content x64 compile failed.'}
      - name: Commit validated installed-content source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs HuymaierNativeConsoleLibraryWorker.ps1;if(git diff --cached --quiet){exit 0};git commit -m 'Materialize v0.26.4 PS4 and Vita installed-content libraries';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Installed-content rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Installed-content push failed.'}
