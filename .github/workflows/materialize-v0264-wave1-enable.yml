name: Enable Huymaier Console v0.26.4 Wave 1 Platforms

on:
  pull_request:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.development/v0.26.4/wave1-enable-request.json'
      - '.development/v0.26.4/apply_wave1_enable.py'
      - '.github/workflows/materialize-v0264-wave1-enable.yml'

permissions:
  contents: write

concurrency:
  group: huymaier-v0264-wave1-enable
  cancel-in-progress: false

jobs:
  enable-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.4-platform-expansion
          fetch-depth: 0
      - name: Enable Wave 1 registry entries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8
          if($registry -notmatch [regex]::Escape('"id": "psp"')){
            python .development\v0.26.4\apply_wave1_enable.py
            if($LASTEXITCODE -ne 0){throw 'Wave 1 enablement materializer failed.'}
          }else{Write-Host 'Wave 1 registry entries already enabled.'}
      - name: Validate Wave 1 entry points
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry=Get-Content -Raw 'EmulatorPlatforms\platform-registry.json' -Encoding UTF8|ConvertFrom-Json
          $enabled=@($registry.platforms|Where-Object{[bool]$_.enabled})
          foreach($id in @('psp','nds','dsi','3ds','dreamcast','saturn')){
            $entry=@($enabled|Where-Object{[string]$_.id -eq $id})
            if($entry.Count -ne 1){throw "Wave 1 registry entry is not enabled exactly once: $id"}
            foreach($cap in @('huymaier-native-path-picker','latest-emulator-install','native-full-emulator-settings','unknown-setting-preservation','native-save-management')){if(@($entry[0].capabilities) -notcontains $cap){throw "$id is missing capability $cap"}}
            $definition=Get-Content -Raw (Join-Path (Join-Path 'EmulatorPlatforms' $id.ToUpperInvariant()) 'platform.json') -Encoding UTF8|ConvertFrom-Json
            if(-not [bool]$definition.enabled){throw "$id platform definition is still disabled."}
          }
          $worker=Get-Content -Raw 'HuymaierNativeConsoleLibraryWorker.ps1' -Encoding UTF8
          foreach($id in @("'3DS'","'NDS'","'DSI'","'DREAMCAST'","'SATURN'","'PSP'")){if($worker -notmatch [regex]::Escape($id)){throw "Library count worker does not know $id"}}
          $installer=Get-Content -Raw 'HuymaierEmulatorInstaller.ps1' -Encoding UTF8
          foreach($id in @("'3DS'","'NDS'","'DSI'","'DREAMCAST'","'SATURN'","'PSP'")){if($installer -notmatch [regex]::Escape($id+' {$exe=')){throw "Latest-emulator installer does not own $id"}}
          $native=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          foreach($marker in @('Render3dsHome','RenderDsMenu','RenderDsiMenu','RenderDreamcastMenu','RenderSaturnMenu','RenderPspXmb','RenderPspSavedDataUtility','RenderDreamcastVmuManager','RenderSaturnMemoryManager','OpenNativeBackendSettings')){if($native -notmatch [regex]::Escape($marker)){throw "Wave 1 production source missing $marker"}}
      - name: Parse PowerShell and compile x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('.\HuymaierConsole.ps1','.\HuymaierEmulatorPlatforms.ps1','.\HuymaierEmulatorInstaller.ps1','.\HuymaierEmulatorSettings.ps1','.\HuymaierEmulatorSettingsWorker.ps1','.\HuymaierNativeConsoleLibraryWorker.ps1')){$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{Write-Host "$path : $($_.Message)"};throw "$path parse failed."}}
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location
          $refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique
          $sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'HuymaierConsole-v0264-wave1.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($r in $refs){$args+=('/reference:'+$r)};$args+=$sources;& $csc @args;if($LASTEXITCODE -ne 0){throw 'Wave 1 enablement x64 compile failed.'}
      - name: Commit validated Wave 1 enablement
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EmulatorPlatforms/platform-registry.json EmulatorPlatforms/PSP/platform.json EmulatorPlatforms/NDS/platform.json EmulatorPlatforms/DSI/platform.json EmulatorPlatforms/3DS/platform.json EmulatorPlatforms/Dreamcast/platform.json EmulatorPlatforms/Saturn/platform.json manifest.json
          if(git diff --cached --quiet){Write-Host 'No Wave 1 enablement changes to commit.';exit 0}
          git commit -m 'Enable validated v0.26.4 Wave 1 native platforms';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 1 enablement rebase failed.'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE -ne 0){throw 'Wave 1 enablement push failed.'}
