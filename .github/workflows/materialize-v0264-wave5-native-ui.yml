name: Materialize Huymaier Console v0.26.4 PS4 Vita Native Settings UI
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/wave5-native-ui-request.json','.development/v0.26.4/apply_wave5_native_settings_storage.py','.development/v0.26.4/apply_wave45_stage.py','.development/v0.26.4/apply_wave45_compile_fixes.py','.github/workflows/materialize-v0264-wave5-native-ui.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-wave5-native-ui, cancel-in-progress: false}
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Ensure Wave 4/5 stage then materialize modern native settings/storage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if($n -notmatch [regex]::Escape('private void RenderWave45Subpage()')){python .development\v0.26.4\apply_wave45_stage.py;if($LASTEXITCODE){throw 'Wave4/5 stage prerequisite failed'}}
          python .development\v0.26.4\apply_wave45_compile_fixes.py
          if($LASTEXITCODE){throw 'Wave4/5 compile overlay prerequisite failed'}
          $n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8
          if($n -notmatch [regex]::Escape('private void RenderModernPlayStationSettings()')){python .development\v0.26.4\apply_wave5_native_settings_storage.py;if($LASTEXITCODE){throw 'PS4/Vita native UI materializer failed'}}
      - name: Validate modern PlayStation native UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$n=Get-Content -Raw 'Native\HuymaierConsole.ConsolePlatforms.cs' -Encoding UTF8;foreach($m in @('RenderWave45Subpage','RenderPs4DynamicMenu','RenderVitaLiveArea','RenderModernPlayStationSettings','RenderModernPlayStationStorage','GetModernPlayStationSaveRoots','Content Manager','Saved Data Management','OpenNativeBackendSettings')){if($n -notmatch [regex]::Escape($m)){throw "Modern PS UI marker missing: $m"}};if($n -match [regex]::Escape('(definition.Shell=="PS4"||definition.Shell=="Vita")&&dashboardSubpage=="settings"){RenderWave1Settings()')){throw 'PS4/Vita settings still fall through to generic Wave1 settings.'}
      - name: Compile exact x64 native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase,System.Xaml,System.Windows.Forms,System.Drawing,System.Web.Extensions;$csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';$automation=[Management.Automation.PSObject].Assembly.Location;$refs=@([Uri].Assembly.Location,[Linq.Enumerable].Assembly.Location,[System.Xaml.XamlReader].Assembly.Location,[Xml.XmlDocument].Assembly.Location,[Windows.DependencyObject].Assembly.Location,[Windows.Media.Visual].Assembly.Location,[Windows.Window].Assembly.Location,[Windows.Forms.Form].Assembly.Location,[Drawing.Bitmap].Assembly.Location,[Web.Script.Serialization.JavaScriptSerializer].Assembly.Location,$automation)|Select-Object -Unique;$sources=@('Native\HuymaierConsole.NativeApp.cs','Native\HuymaierConsole.Ps1.cs','Native\HuymaierConsole.ConsolePlatforms.cs','Native\HuymaierConsole.SystemOverlay.cs','Native\HuymaierConsole.GameInput.cs','HuymaierNativeInput.cs','HuymaierNativeDisplay.cs','HuymaierNativeAudio.cs','HuymaierPerformance.cs','EmulatorPlatforms\Shared\Huymaier.P3T.cs');$out=Join-Path $env:RUNNER_TEMP 'hc-wave5-ui.dll';$args=@('/noconfig','/nologo','/target:library','/platform:x64','/optimize+',('/out:'+$out));foreach($ref in $refs){$args+=('/reference:'+$ref)};$args+=$sources;& $csc @args;if($LASTEXITCODE-ne 0){throw 'PS4/Vita native UI x64 compile failed'}
      - name: Commit validated native UI source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add Native/HuymaierConsole.ConsolePlatforms.cs;if(git diff --cached --quiet){exit 0};git commit -m 'Materialize v0.26.4 PS4 Vita native settings and storage UI';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'PS4/Vita native UI rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne 0){throw 'PS4/Vita native UI push failed'}
