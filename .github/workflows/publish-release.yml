name: Publish Huymaier Console Release

on:
  push:
    branches: [ main ]
    paths:
      - '.release/release.json'

permissions:
  contents: write

concurrency:
  group: huymaier-console-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release manifest
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          p = '.release/release.json'
          data = json.load(open(p, encoding='utf-8'))
          required = ['version','tag','title','asset_name','package_root','notes_file']
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit('Missing release manifest fields: ' + ', '.join(missing))
          out = os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              for k in required:
                  f.write(f"{k}={data[k]}\n")
              f.write(f"publish={str(bool(data.get('publish', False))).lower()}\n")
              f.write(f"patch_dir={data.get('patch_dir','')}\n")
          open('/tmp/delete-paths.txt','w',encoding='utf-8').write('\n'.join(data.get('delete_paths', [])))
          PY

      - name: Stop when manifest is staged only
        if: steps.manifest.outputs.publish != 'true'
        run: echo 'Release manifest is staged with publish=false; nothing to publish.'

      - name: Check target release
        id: existing
        if: steps.manifest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; validating its required assets."
            mapfile -t assets < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            printf '%s\n' "${assets[@]}"
            printf '%s\n' "${assets[@]}" | grep -Fxq "$ASSET_NAME"
            printf '%s\n' "${assets[@]}" | grep -Fxq "$ASSET_NAME.sha256"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous full release package
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/hc-base
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir /tmp/hc-base
          BASE_ZIP="$(find /tmp/hc-base -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "$BASE_ZIP" ] || [ ! -f "$BASE_ZIP" ]; then
            echo 'No installable ZIP asset was found on the previous GitHub Release.'
            exit 1
          fi
          echo "Using base package: $BASE_ZIP"
          echo "BASE_ZIP=$BASE_ZIP" >> "$GITHUB_ENV"

      - name: Stage package and apply verified release delta
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          PACKAGE_ROOT: ${{ steps.manifest.outputs.package_root }}
          PATCH_DIR: ${{ steps.manifest.outputs.patch_dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hc-extract /tmp/hc-stage
          mkdir -p /tmp/hc-extract /tmp/hc-stage
          unzip -q "$BASE_ZIP" -d /tmp/hc-extract
          mapfile -t roots < <(find /tmp/hc-extract -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -eq 1 ]; then BASE_ROOT="${roots[0]}"; else BASE_ROOT='/tmp/hc-extract'; fi
          DEST="/tmp/hc-stage/$PACKAGE_ROOT"
          mkdir -p "$DEST"
          cp -a "$BASE_ROOT"/. "$DEST"/

          # Overlay tracked package source/configuration. Repository-only release plumbing
          # and early standalone updater prototypes are deliberately not packaged.
          while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.release/*|.gitignore|README.md|RELEASING.md|GITHUB-RELEASES.md|HuymaierConsoleUpdate.ps1|HuymaierConsoleUpdateWorker.ps1|HuymaierConsoleApplyUpdate.ps1) continue ;;
            esac
            [ -f "$f" ] || continue
            mkdir -p "$DEST/$(dirname "$f")"
            cp -f "$f" "$DEST/$f"
          done < <(git ls-files -z)

          if [ -s /tmp/delete-paths.txt ]; then
            while IFS= read -r p; do [ -n "$p" ] && rm -rf "$DEST/$p"; done < /tmp/delete-paths.txt
          fi

          if [ -n "$PATCH_DIR" ]; then
            shopt -s nullglob
            patches=("$GITHUB_WORKSPACE/$PATCH_DIR"/*.patch)
            if [ "${#patches[@]}" -eq 0 ]; then echo "Patch directory contains no .patch files: $PATCH_DIR"; exit 1; fi
            for patch_file in "${patches[@]}"; do
              echo "Applying $(basename "$patch_file")"
              (cd "$DEST" && git apply -p2 --whitespace=nowarn "$patch_file")
            done
          fi
          echo "PACKAGE_DIR=$DEST" >> "$GITHUB_ENV"

      - name: Verify staged release version
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          root=os.environ['PACKAGE_DIR']; manifest=os.path.join(root,'manifest.json')
          if not os.path.isfile(manifest): raise SystemExit('Packaged manifest.json is missing.')
          actual=str(json.load(open(manifest,encoding='utf-8-sig')).get('version','')); expected=os.environ['VERSION']
          if actual != expected: raise SystemExit(f'Package version mismatch: expected {expected}, found {actual}')
          print(f'Verified staged package version {actual}.')
          PY

      - name: Regenerate internal checksums
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          root=os.environ['PACKAGE_DIR']; excluded={'checksums.sha256','SHA256SUMS.txt'}; rows=[]
          for dp, _, names in os.walk(root):
              for name in names:
                  rel=os.path.relpath(os.path.join(dp,name),root).replace(os.sep,'/')
                  if rel in excluded: continue
                  p=os.path.join(root,rel.replace('/',os.sep)); h=hashlib.sha256()
                  with open(p,'rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
                  rows.append((rel,h.hexdigest()))
          rows.sort(key=lambda x:x[0].lower()); text=''.join(f'{h}  {rel}\n' for rel,h in rows)
          for name in excluded: open(os.path.join(root,name),'w',encoding='utf-8',newline='\n').write(text)
          print(f'Checksummed {len(rows)} payload files.')
          PY

      - name: Build release ZIP and SHA-256 asset
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          PACKAGE_ROOT: ${{ steps.manifest.outputs.package_root }}
        shell: bash
        run: |
          cd /tmp/hc-stage
          zip -q -r "$GITHUB_WORKSPACE/$ASSET_NAME" "$PACKAGE_ROOT"
          cd "$GITHUB_WORKSPACE"
          HASH="$(sha256sum "$ASSET_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$ASSET_NAME" > "$ASSET_NAME.sha256"
          echo "Release asset SHA-256: $HASH"

      - name: Publish GitHub Release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          NOTES_FILE: ${{ steps.manifest.outputs.notes_file }}
        shell: bash
        run: |
          [ -f "$NOTES_FILE" ] || { echo "Release notes file not found: $NOTES_FILE"; exit 1; }
          gh release create "$TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"

      - name: Record release attempt status
        if: always() && steps.manifest.outputs.publish == 'true'
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          RESULT: ${{ job.status }}
          EXISTED: ${{ steps.existing.outputs.exists }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, datetime
          state={
            'tag':os.environ.get('TAG',''), 'version':os.environ.get('VERSION',''),
            'asset':os.environ.get('ASSET_NAME',''), 'result':os.environ.get('RESULT','unknown'),
            'alreadyPublished':os.environ.get('EXISTED','')=='true',
            'commit':os.environ.get('GITHUB_SHA',''),
            'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          os.makedirs('.release',exist_ok=True)
          open('.release/status.json','w',encoding='utf-8').write(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record $TAG release status"
          git push
