name: Apply v0.26.3 Authentic Console Integration

on:
  push:
    branches:
      - feature/v0.26.3-console-fidelity
    paths:
      - '.github/workflows/apply-v0263-authentic.yml'
      - '.development/v0.26.3/authentic-request.json'

permissions:
  contents: write

concurrency:
  group: v0263-authentic-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.26.3-console-fidelity
          fetch-depth: 0

      - name: Apply checksum-verified RC3 production patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"build": "native-console-fidelity-rc3"' manifest.json; then
            echo 'RC3 production source is already materialized.'
            exit 0
          fi
          python3 .development/v0.26.3/apply_rc3_patch_v2.py
          python3 - <<'PY'
          import json, datetime
          state={
            'batch':'console-fidelity-4-authentic-integration-v2',
            'script':'apply_rc3_patch_v2.py',
            'patchSha256':'f6ca760aade9136b9c830b61d7eec34473e50a24a64c245e450d0be1e5b9a98c',
            'result':'success',
            'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('.development/v0.26.3/status.json','w',encoding='utf-8').write(json.dumps(state,indent=2)+'\n')
          PY

      - name: Commit only intended production batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            HuymaierConsole.ps1 \
            HuymaierEmulatorPlatforms.ps1 \
            HuymaierEmulatorInstaller.ps1 \
            HuymaierLibraryWorker.ps1 \
            HuymaierSteamWorker.ps1 \
            HuymaierSteamOwnership.ps1 \
            Native/HuymaierConsole.ConsolePlatforms.cs \
            Native/HuymaierConsole.NativeApp.cs \
            Native/HuymaierConsole.Ps1.cs \
            EmulatorPlatforms/N64/settings.default.json \
            EmulatorPlatforms/GameCube/settings.default.json \
            EmulatorPlatforms/Wii/settings.default.json \
            EmulatorPlatforms/WiiU/settings.default.json \
            EmulatorPlatforms/Switch/settings.default.json \
            EmulatorPlatforms/Xbox/settings.default.json \
            EmulatorPlatforms/Xbox360/settings.default.json \
            EmulatorPlatforms/platform-registry.json \
            manifest.json \
            RELEASE_NOTES.txt \
            .development/v0.26.3/status.json
          if git diff --cached --quiet; then
            echo 'Authentic console integration already applied.'
            exit 0
          fi
          git commit -m 'Apply v0.26.3 authentic console and emulator integration'
          git push origin HEAD:feature/v0.26.3-console-fidelity
