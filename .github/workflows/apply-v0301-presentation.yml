name: Apply v0.30.1 Presentation

on:
  push:
    branches: [ feature/v0.30.1-brightness-fan-motion ]
    paths:
      - '.development/v0.30.1/apply-presentation.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply brightness and presentation contracts
        shell: python
        run: |
          from pathlib import Path

          path=Path('HuymaierUser3DModels.ps1')
          text=path.read_text(encoding='utf-8-sig')

          replacements=[
            ("[math]::Max(50,[math]::Min(250,[int]$script:Config.PlatformModelBrightness))", "[math]::Max(0,[math]::Min(200,[int]$script:Config.PlatformModelBrightness))", 1),
            ("'Adjust lighting for both the Games 3D shelves and the full-screen model viewer.' 50 250", "'Adjust lighting for both the Games 3D shelves and the full-screen model viewer.' 0 200", 2),
            ("[math]::Max(50,[math]::Min(250,([int]$script:Config.PlatformModelBrightness)+$Delta))", "[math]::Max(0,[math]::Min(200,([int]$script:Config.PlatformModelBrightness)+$Delta))", 1),
            ("Selected shelf models rotate continuously without rebuilding the Games page.", "Selected shelf models use a subtle bounded fan-style presentation motion without rebuilding the Games page.", 1),
          ]
          for old,new,count in replacements:
              found=text.count(old)
              if found != count:
                  raise SystemExit(f'Expected {count} occurrence(s) of {old!r}, found {found}')
              text=text.replace(old,new)

          marker='# HUYMAIER_V0301_BRIGHTNESS_0_200_AND_FAN_MOTION_V1\n'
          if marker not in text:
              text=marker+text
          path.write_text(text,encoding='utf-8',newline='\n')

          host=Path('Native/HuymaierD3D11ShelfHost.cs').read_text(encoding='utf-8-sig')
          required=[
            'HUYMAIER_D3D11_SHELF_HOST_V3_BOUNDED_FAN_MOTION',
            'Math.Max(0.0, Math.Min(200.0, percent))',
            'FanPeriodSeconds = 8.0',
            'FanPhaseAmplitude = 0.75f',
            '-FanPhaseAmplitude * (float)Math.Sin',
          ]
          missing=[token for token in required if token not in host]
          if missing:
              raise SystemExit('Missing native v0.30.1 presentation contract: '+', '.join(missing))

      - name: Add presentation regression gate
        shell: bash
        run: |
          cat > .development/v0.30.1/Test-v0301-Presentation.ps1 <<'PS1'
          param([string]$RepoRoot=(Split-Path -Parent (Split-Path -Parent $PSScriptRoot)))
          Set-StrictMode -Version 2.0
          $ErrorActionPreference='Stop'
          $user=Get-Content -Raw -LiteralPath (Join-Path $RepoRoot 'HuymaierUser3DModels.ps1') -Encoding UTF8
          $host=Get-Content -Raw -LiteralPath (Join-Path $RepoRoot 'Native\HuymaierD3D11ShelfHost.cs') -Encoding UTF8

          foreach($token in @(
            'HUYMAIER_V0301_BRIGHTNESS_0_200_AND_FAN_MOTION_V1',
            '[math]::Max(0,[math]::Min(200,[int]$script:Config.PlatformModelBrightness))',
            "'3D model brightness' ([int]`$script:Config.PlatformModelBrightness) 'Adjust lighting for both the Games 3D shelves and the full-screen model viewer.' 0 200",
            '[math]::Max(0,[math]::Min(200,([int]$script:Config.PlatformModelBrightness)+$Delta))'
          )){if(-not$user.Contains($token)){throw "Missing 0-200 brightness contract: $token"}}
          if($user -match "platform-model-brightness-slider'.*50 250"){throw 'Legacy 50-250 brightness range remains active.'}

          foreach($token in @(
            'HUYMAIER_D3D11_SHELF_HOST_V3_BOUNDED_FAN_MOTION',
            'FanPeriodSeconds = 8.0',
            'FanPhaseAmplitude = 0.75f',
            '-FanPhaseAmplitude * (float)Math.Sin',
            'Math.Max(0.0, Math.Min(200.0, percent))'
          )){if(-not$host.Contains($token)){throw "Missing bounded fan/native brightness contract: $token"}}
          if($host.Contains('float phase = (float)renderClock.Elapsed.TotalSeconds;')){throw 'Legacy unbounded phase still drives continuous turntable rotation.'}
          Write-Host 'platformModelBrightness0To200Gate: success'
          Write-Host 'platformModelBoundedFanMotionGate: success'
          PS1

      - name: Commit applied v0.30.1 presentation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HuymaierUser3DModels.ps1 Native/HuymaierD3D11ShelfHost.cs .development/v0.30.1/Test-v0301-Presentation.ps1
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply v0.30.1 brightness and fan motion'
          git push
