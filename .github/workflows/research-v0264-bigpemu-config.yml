name: Research v0.26.4 BigPEmu Configuration Format
on:
  pull_request:
    branches: [feature/v0.26.3-console-fidelity]
    paths: ['.development/v0.26.4/bigpemu-config-request.json','.github/workflows/research-v0264-bigpemu-config.yml']
permissions: {contents: write}
concurrency: {group: huymaier-v0264-bigpemu-config, cancel-in-progress: true}
jobs:
  research:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v0.26.4-platform-expansion, fetch-depth: 0}
      - name: Generate current official BigPEmu x64 configuration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$headers=@{'User-Agent'='Huymaier-Console-v0.26.4-config-audit'}
          $pageUrl='https://www.richwhitehouse.com/jaguar/index.php?content=download';$page=Invoke-WebRequest -UseBasicParsing -Uri $pageUrl -Headers $headers;$html=[string]$page.Content
          $match=[regex]::Match($html,'(?is)Windows\s*\(x64\).{0,1200}?href=["''](?<url>[^"'']*BigPEmu[^"'']*\.zip)["'']');if(-not$match.Success){throw 'Official BigPEmu x64 link not found.'}
          $href=[Net.WebUtility]::HtmlDecode($match.Groups['url'].Value);$url=$(if($href-match'^https?://'){$href}else{(New-Object Uri ([uri]$pageUrl),$href).AbsoluteUri})
          $work=Join-Path $env:RUNNER_TEMP 'hc-bigpemu-config';Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path $work|Out-Null;$zip=Join-Path $work 'BigPEmu-x64.zip';Invoke-WebRequest -UseBasicParsing -Uri $url -Headers $headers -OutFile $zip;$stage=Join-Path $work 'stage';Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
          $exe=Get-ChildItem $stage -File -Recurse -Filter 'BigPEmu.exe'|Select-Object -First 1;if(-not$exe){throw 'BigPEmu.exe missing.'};$bytes=[IO.File]::ReadAllBytes($exe.FullName);$pe=[BitConverter]::ToInt32($bytes,0x3c);if([BitConverter]::ToUInt16($bytes,$pe+4)-ne0x8664){throw 'Downloaded BigPEmu is not x64.'}
          $p=Start-Process -FilePath $exe.FullName -ArgumentList @('*null','-localdata') -WorkingDirectory $exe.Directory.FullName -PassThru;Start-Sleep -Seconds 6;if(-not$p.HasExited){try{$p.CloseMainWindow()|Out-Null;Start-Sleep -Seconds 1}catch{};if(-not$p.HasExited){$p.Kill();$p.WaitForExit()}}
          $config=Get-ChildItem $exe.Directory.FullName -File -Recurse -Filter 'BigPEmuConfig.bigpcfg' -ErrorAction SilentlyContinue|Select-Object -First 1;if(-not$config){throw 'BigPEmuConfig.bigpcfg was not generated in -localdata mode.'}
          $raw=[IO.File]::ReadAllBytes($config.FullName);$text=[Text.Encoding]::UTF8.GetString($raw);$encoding='utf8-or-ansi';if($raw.Length-ge2-and$raw[0]-eq0xFF-and$raw[1]-eq0xFE){$encoding='utf16-le';$text=[Text.Encoding]::Unicode.GetString($raw,2,$raw.Length-2)}elseif($raw.Length-ge3-and$raw[0]-eq0xEF-and$raw[1]-eq0xBB-and$raw[2]-eq0xBF){$encoding='utf8-bom';$text=[Text.Encoding]::UTF8.GetString($raw,3,$raw.Length-3)}
          $jsonValid=$false;try{$null=$text|ConvertFrom-Json;$jsonValid=$true}catch{}
          $sample=@(($text -split "`r?`n")|Select-Object -First 120|ForEach-Object{if($_.Length-gt400){$_.Substring(0,400)}else{$_}})
          $report=[ordered]@{generatedAtUtc=[DateTime]::UtcNow.ToString('o');downloadUrl=$url;sha256=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();configPath=$config.FullName;configBytes=$raw.Length;encoding=$encoding;jsonValid=$jsonValid;equalsLineCount=@([regex]::Matches($text,'(?m)^\s*[A-Za-z0-9_.-]+\s*=')).Count;colonLineCount=@([regex]::Matches($text,'(?m)^\s*[A-Za-z0-9_.-]+\s*:')).Count;braceCount=@([regex]::Matches($text,'[{}]')).Count;sample=$sample}
          $report|ConvertTo-Json -Depth 6|Set-Content '.development\v0.26.4\bigpemu-config-research.json' -Encoding UTF8
      - name: Commit bounded format research
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .development/v0.26.4/bigpemu-config-research.json;if(git diff --cached --quiet){exit 0};git commit -m 'Record current BigPEmu configuration format';git fetch origin feature/v0.26.4-platform-expansion;git rebase origin/feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'BigPEmu config research rebase failed'};git push origin HEAD:feature/v0.26.4-platform-expansion;if($LASTEXITCODE-ne0){throw 'BigPEmu config research push failed'}
