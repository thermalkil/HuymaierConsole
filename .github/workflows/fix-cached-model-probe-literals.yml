name: Fix cached-model probe numeric literals

on:
  push:
    paths:
      - '.github/workflows/fix-cached-model-probe-literals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Fix strict-mode single casts and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.development/v0.26.5/Test-v0265-D3D11CachedModelRender.ps1')
          text=p.read_text(encoding='utf-8-sig')
          replacements={
            '[single]-1':'[single](-1)',
            '[single]-.65':'[single](-0.65)',
            '[single].65':'[single](0.65)',
            '[single].5':'[single](0.5)',
          }
          before=text
          for old,new in replacements.items(): text=text.replace(old,new)
          if text==before: raise SystemExit('Cached-model strict-mode literals were not found')
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/fix-cached-model-probe-literals.yml').unlink()
      - name: Commit probe correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict-mode cached-model D3D11 probe literals'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
