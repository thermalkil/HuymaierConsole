name: Fix cached-model native headers

on:
  push:
    paths:
      - '.github/workflows/fix-cached-model-native-headers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.26.5-performance-and-downloads
          fetch-depth: 0
      - name: Add NOMINMAX and memory include then self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('Native/HuymaierD3D11ShelfAssetSmoke.cpp')
          text=p.read_text(encoding='utf-8-sig')
          if '#define NOMINMAX' not in text:
              text=text.replace('#define WIN32_LEAN_AND_MEAN\n', '#define WIN32_LEAN_AND_MEAN\n#define NOMINMAX\n',1)
          if '#include <memory>' not in text:
              text=text.replace('#include <cstdint>\n', '#include <cstdint>\n#include <memory>\n',1)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/fix-cached-model-native-headers.yml').unlink()
      - name: Commit native header correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thermalkil'
          git config user.email '98826286+thermalkil@users.noreply.github.com'
          git add -A
          git commit -m 'Fix native cached-model smoke C++ headers'
          git push origin HEAD:feature/v0.26.5-performance-and-downloads
